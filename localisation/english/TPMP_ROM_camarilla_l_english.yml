 TPMP_ROM_camarilla_decisions: "The Camarilla"
 TPMP_ROM_camarilla_decisions_desc: "Behind the throne stands a rotating circle of favorites; financiers, mistresses, royal courtiers and ministers alike each granted the King's ear for a season before falling from favor. Whoever currently holds that seat shapes the nation in ways both helpful and costly, for as long as their time lasts.\n\nThis rotation happens on its own, roughly every 90 days, cycling through the full circle before turning back to the start. The King may [b]Prolong[/b] a favorite's stay to keep their influence a while longer, or [b]Curtail[/b] it to hasten their fall sooner."

 TPMP_ROM_camarilla_extend_decision: "Prolong the Favorite's Influence"
 TPMP_ROM_camarilla_extend_decision_desc: "The current favorite of the court can be kept close a while longer, at the King's discretion. Adds 4 weeks to the timer."

 TPMP_ROM_camarilla_curtail_decision: "Curtail the Favorite's Influence"
 TPMP_ROM_camarilla_curtail_decision_desc: "The current favorite's star is fading a little faster. Removes 4 weeks from the timer."

 TPMP_ROM_camarilla_base_term_tt: "Base term: 90 days"

