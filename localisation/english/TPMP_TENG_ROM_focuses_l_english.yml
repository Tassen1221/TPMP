l_english:
 TPMP_ROM_preserve_greater_romania: "Preserve Greater Romania"
 TPMP_ROM_preserve_greater_romania_desc: "We have at last managed to unite all Romanian speakers in our country. Now, we must ensure that our children may inherit our legacy of a Romania for all Romanians."
 TPMP_ROM_malaxa_and_resita: "Malaxa and Reşiţa"
 TPMP_ROM_malaxa_and_resita_desc: "Nicolae Malaxa and the ironworks at Reşiţa form the backbone of our heavy industry. Malaxa built his fortune on locomotives and armaments and is no stranger to the palace, while Reşiţa's furnaces have supplied Romania with iron and steel since the last century."
 TPMP_ROM_the_titan_plant: "The Titan Plant"
 TPMP_ROM_the_titan_plant_desc: "The Titan works near Bucharest already supply much of our railway stock. With state investment, their capacity can be expanded considerably, turning them into a proper pillar of our domestic industry."
 TPMP_ROM_the_titan_plant_bonus_tooltip: "§G100%§! §YConcentrated Industry§! research, reduced to\n§G50%§! §YDispersed Industry§! if Dispersed is selected or completed"
 TPMP_ROM_tohran_complex_bonus_tooltip: "§G100%§! §YDispersed Industry§! research, reduced to\n§G50%§! §YConcentrated Industry§! if Concentrated is selected or completed"
 TPMP_ROM_locomotive_import_ban: "Locomotive Import Ban"
 TPMP_ROM_locomotive_import_ban_desc: "Malaxa's works have built locomotives for the CFR for over a decade now, and to a standard fully equal to anything bought abroad. There is little reason to keep sending this business to foreign firms when our own industry can meet the need."
 TPMP_ROM_republica_pipe_factory: "Republica Pipe Factory"
 TPMP_ROM_republica_pipe_factory_desc: "The Republica works already produce seamless steel tubing, supplying our oil fields at Ploieşti. Expanding the plant will let us meet our own demand rather than continuing to import the pipe we need."
 TPMP_ROM_german_engineering: "German Engineering In the House"
 TPMP_ROM_german_engineering_desc: "Our own machinery, whatever it can charitably be called, is not worth keeping around any longer. German firms are happy to replace it wholesale, and once they are done, there will be no mistaking whose engineering is in the house, ja."
 TPMP_ROM_ploesti_oil_field_development: "Ploieşti Oil Field Development"
 TPMP_ROM_ploesti_oil_field_development_desc: "We possess some of the largest oil fields in Europe in Ploiesti, and these are of tremendous importance not only for ourselves, but also for our allies and other nations in the region. We should increase the fields' production to better meet the demands."
 TPMP_ROM_civil_works: "Civil Works"
 TPMP_ROM_civil_works_desc: "Greater Romania will require an extensive program of industrial development if it is to support a large-scale military build-up. We will start it now."
 TPMP_ROM_danubian_transport_network: "Danubian Transport Network"
 TPMP_ROM_danubian_transport_network_desc: "Our transport capabilities alongside the Danube can be drastically improved upon, both by utilizing the river itself more effectively and the way it is connected to our road and rail networks."
 TPMP_ROM_hunedoara_iron_works: "Hunedoara Iron Works"
 TPMP_ROM_hunedoara_iron_works_desc: " To feed the needs of our arms production the great ironworks in Transylvania must be modernized and drastically expanded."
 TPMP_ROM_invite_foreign_motor_companies: "Invite Foreign Motor Companies"
 TPMP_ROM_invite_foreign_motor_companies_desc: "Rather than expend resources on increasing production of unproven domestic automobile designs, we would benefit more from producing tried and tested foreign designs under license."
 TPMP_ROM_trade_treaty_with_germany: "Trade Treaty with Germany"
 TPMP_ROM_trade_treaty_with_germany_desc: "We know of the German economic interest in our country. Arranging increased delivery of goods such as oil will enable us to request German aid in modernizing our military."
 TPMP_ROM_tohran_complex: "Tohan Complex"
 TPMP_ROM_tohran_complex_desc: "The armaments works at Tohan, near Zărneşti, were built to reduce our reliance on imported munitions. Expanding the complex further will let it turn out finished weapons rather than raw components."
 TPMP_ROM_arc_furnance: "Import Arc Furnace"
 TPMP_ROM_arc_furnance_desc: "Producing the alloy steel our arms industry needs will require modern electric arc furnaces, which we presently lack. Importing this equipment will let Reşiţa and our other works finally produce it themselves."
 TPMP_ROM_fortify_the_borders: "Fortify the Borders"
 TPMP_ROM_fortify_the_borders_desc: "Now that the domestic situation is under control, we must look at improving the defence of our borders from outside threats."
 TPMP_ROM_license_foreign_equipment: "License Foreign Equipment"
 TPMP_ROM_license_foreign_equipment_desc: "Rather than develop every weapon system from scratch, it will often be faster and cheaper to license proven foreign designs and adapt them to our own production lines."
 TPMP_ROM_expand_the_university_of_bucharest: "Expand the University of Bucharest"
 TPMP_ROM_expand_the_university_of_bucharest_desc: "By improving the quality and capacity of our university, we can increase the pool of best and brightest that we rely on for our technological advances."
 TPMP_ROM_wohlthat_agreement: "Wohlthat Agreement"
 TPMP_ROM_wohlthat_agreement_desc: "Helmuth Wohlthat has arrived in Bucharest with a five-year treaty already drafted, binding our grain, timber, oil and industry alike to German requirements in exchange for machinery and armaments we could get nowhere else. Bucharest is left with little real say in the matter, and less still in what it means for our independence."
 TPMP_ROM_poker_night_at_the_royal_palace: "Malaxa's Ascension"
 TPMP_ROM_poker_night_at_the_royal_palace_desc: "With Auschnitt disgraced and swept aside by the changing tide, Malaxa is left without a rival in Romanian steel and armaments. Few men anywhere in the country now wield as much influence."
 TPMP_ROM_expand_resita_works: "Expand Reşiţa Works"
 TPMP_ROM_expand_resita_works_desc: "With German backing secured, there is no reason to hold back on further expanding Reşiţa's arms production. The works can be enlarged well beyond what peacetime budgets alone would ever have allowed."
 TPMP_ROM_domestic_small_arms: "Domestic Small Arms"
 TPMP_ROM_domestic_small_arms_desc: "Our arsenal at Cugir already produces a serviceable rifle under foreign license. Expanding this line will let us finally arm our soldiers without depending on outside suppliers."
 TPMP_ROM_invest_in_the_iar: "Expand IAR Facilities"
 TPMP_ROM_invest_in_the_iar_desc: "It is critical to keep up with the demands of a modern air force. Our industry must be capable not only of building the machines we require in the first place, but also of doing so at a pace fast enough to replace operational losses."
 TPMP_ROM_german_romanian_oil_exploitation_company: "German-Romanian Oil Exploitation Company"
 TPMP_ROM_german_romanian_oil_exploitation_company_desc: "German need for oil is tremendous, providing us with a lucrative opportunity to expand our oil refineries."
 TPMP_ROM_found_solagra: "Found Solagra"
 TPMP_ROM_found_solagra_desc: "A joint Romanian-German company, Solagra, is to be founded to expand our cultivation of oilseed crops for export to Germany. Berlin is eager to invest in the venture, provided we guarantee the harvest."
 TPMP_ROM_fuel_for_the_war_machines: "Fuel for the War Machines"
 TPMP_ROM_fuel_for_the_war_machines_desc: "Germany, Italy, Hungary and Bulgaria all depend on Romanian oil to keep their armies moving, and demand only grows by the year. Guaranteeing a steady supply to our neighbours will keep us indispensable, whatever comes."
 TPMP_ROM_exploit_the_baita_mines: "Exploit the Băiţa Mines"
 TPMP_ROM_exploit_the_baita_mines_desc: "It is beginning to become clear that uranium is of vital importance to some of the most drastic technological advances in weaponry since the invention of the firearm. We are lucky enough to have a large deposit of the stuff within our borders, and we should set up a mine to exploit it."
 TPMP_ROM_sideline_titulescu: "Sideline Titulescu"
 TPMP_ROM_sideline_titulescu_desc: "Nicolae Titulescu has served us well as foreign minister, but his devotion to the French alliance and the League leaves him increasingly out of step with where Europe is heading. Better to ease him out now, on our own terms, than be forced to later."
 TPMP_ROM_sideline_titulescu_tooltip: "Titulescu will be permanently §Rremoved§! from the Camarilla advisor rotation"
 TPMP_ROM_sideline_titulescu_warning_tt: "§RIF HIS TENURE COMPLETES, TITULESCU WILL BLOW OUR BUDGET ON EQUIPMENT THAT MAY BE OUTDATED BY THE TIME WAR BREAKS OUT!§!"
 TPMP_ROM_1937_romanian_general_election: "1937 Romanian General Election"
 TPMP_ROM_1937_romanian_general_election_desc: "The constitution requires a new general election to be called, and it is not a duty we can put off any longer. Every party in the country senses an opportunity, and the campaign already promises to be a bitter one."
 TPMP_ROM_1937_romanian_general_election_warning_tt: "§YIf this focus is not completed, the election will be held in December 1937§!"
 TPMP_ROM_alliance_with_the_PNC: "Alliance with the PNC"
 TPMP_ROM_alliance_with_the_PNC_desc: "We hold no seat in the King's council chambers, but our numbers in the streets and at the ballot box are impossible to ignore. Allying with Goga's National Christian Party, rivals though we are, would combine two nationalist movements into a single bloc too large for Bucharest to dismiss."
 TPMP_ROM_the_national_legionary_state: "The National Legionary State"
 TPMP_ROM_the_national_legionary_state_desc: "Rather than scheme in the shadows any longer, we will stand before the whole country and dare anyone to remove us from power. The King will no doubt already be making plans to slip out with whatever gold he can carry; every other party can dissolve quietly, or be dissolved."
 TPMP_ROM_romanian_science: "Romanian Science"
 TPMP_ROM_romanian_science_desc: "Whatever else changes in Bucharest, our universities and laboratories cannot be allowed to fall further behind those of our neighbours. A renewed commitment to Romanian science is long overdue."
 TPMP_ROM_nationalize_key_industries: "Nationalize Key Industries"
 TPMP_ROM_nationalize_key_industries_desc: "We have long promised to return Romanian industry to Romanian hands, and Auschnitt's steel empire is the clearest place to start. Bringing his works under state control will finally make good on that promise."
 TPMP_ROM_night_of_the_green_knives: "Night of the Green Knives"
 TPMP_ROM_night_of_the_green_knives_desc: "The old regime's ministers, mistresses, and hangers-on alike have no place in the state we are building. One decisive night should be enough to remove the lot of them for good."
 TPMP_ROM_promise_them_our_victory: "Promise Them Our Victory"
 TPMP_ROM_promise_them_our_victory_desc: "Northern Transylvania is gone, handed to Hungary without a shot fired in its defence, and the wound to national pride runs deep. Let us instead point the country east, where victory over Bolshevism promises a glory far greater than anything lost."
 TPMP_ROM_the_iron_guard: "The Iron Guard"
 TPMP_ROM_the_iron_guard_desc: "We are no longer an outside movement to be watched and managed. The Legion is the government now, and it is past time our institutions reflected that plainly."
 TPMP_ROM_institute_royal_dictatorship: "Institute Royal Dictatorship"
 TPMP_ROM_institute_royal_dictatorship_desc: "The time has come to further increase the King's already-extensive powers, bringing political stability to the nation and enabling it to focus on threats from outside."
 TPMP_ROM_revise_the_constitution: "Revise the Constitution"
 TPMP_ROM_revise_the_constitution_desc: "The constitution must be rewritten to solidify the King's position as the nation's leader. Furthermore, dangerous far-right movements can be undermined by providing a safer alternative in the King's Sentinel of the Motherland youth organization."
 TPMP_ROM_combat_favoritism: "Combat Favoritism"
 TPMP_ROM_combat_favoritism_desc: "The King's Camarilla's endless intrigues and favor-trading have done more to weaken Romania than any foreign power ever could. Romania must combat the king's court's favoritism and work to weaken the influence of the King."
 TPMP_ROM_translyvanian_fiasco: "Transylvanian Fiasco"
 TPMP_ROM_translyvanian_fiasco_desc: "Hungary has never accepted the loss of Transylvania, and with Berlin and Rome now backing them in the dispute, the pressure to make concessions has never been greater. no matter the cookie crumbles, the loss of Northern T ransylvania seems inevitable."
 TPMP_ROM_translyvanian_fiasco_warning_tt: "§YIf this focus is not completed, Hungary will be awarded Northern Transylvania in August, 1940, or whenever Hungary demands it§!"
 TPMP_ROM_translyvanian_fiasco_instability_tt: "Losing Northern Transylvania will cause §Yinstability§!"
 TPMP_ROM_present_a_scapegoat: "Poker Night at the Royal Palace"
 TPMP_ROM_present_a_scapegoat_desc: "A few friendly hands of cards, a great deal of expensive wine, and by morning somebody at the table needs to take the blame for Transylvania. A man of Auschnitt's background makes an easy enough scapegoat, and he never did know when to fold."
 TPMP_ROM_the_generals_ultimatum: "The General's Ultimatum"
 TPMP_ROM_the_generals_ultimatum_desc: "The loss of Transylvania has proven the last straw for General Antonescu, who now moves against the throne with what remains of the Legion at his side, ultimatum in hand. The Legion has never made a secret of who it intends to settle scores with once the takeover is done."
 TPMP_ROM_his_majestys_loyal_government: "His Majesty's Loyal Government"
 TPMP_ROM_his_majestys_loyal_government_desc: "Domestic loyalty is paramount, and as long as the nation stands behind its King a pragmatic foreign policy is unnecessary."
 TPMP_ROM_camarilla_renewed: "Camarilla Renewed"
 TPMP_ROM_camarilla_renewed_desc: "With Auschnitt gone, the Camarilla is far from finished. If anything, its surviving favourites are only tightening their grip now that a rival or two has been cleared from the table."
 TPMP_ROM_crack_down_on_extremism: "Crack Down on Extremism"
 TPMP_ROM_crack_down_on_extremism_desc: "The Legion has served its purpose, and its taste for street violence and score-settling is now more liability than asset. General Antonescu will move against his former allies directly, and rule alone from here on."
 TPMP_ROM_a_king_in_name_only: "A King in Name Only"
 TPMP_ROM_a_king_in_name_only_desc: "Michael is barely out of his teens, and it shows. Antonescu finds him easy enough to manage, so long as the boy sticks to ribbon-cuttings and stays well clear of anything resembling policy."
 TPMP_ROM_all_parties_must_end: "All Parties Must End"
 TPMP_ROM_all_parties_must_end_desc: "No party lasts forever, and the current geopolitical situation requires our King's undivided attention. He may throw one cracker of a party once the war is over, but for now he must leave his hedonistic ways behind him."
 TPMP_ROM_the_conducator: "The Conducător"
 TPMP_ROM_the_conducator_desc: "The state answers to one man now. Antonescu is Conducător in truth as well as name, and Romania shall be conducted accordingly."
 TPMP_ROM_army_maneuvers: "Army Maneuvers"
 TPMP_ROM_army_maneuvers_desc: "Our army must be brought back in shape for potential future armed conflicts. We will send them on maneuvers to develop new tactics and strategies."
 TPMP_ROM_form_peasant_militias: "Form Peasant Militias"
 TPMP_ROM_form_peasant_militias_desc: "With the communist ideals that we take from our neighbour comes the duty of every man to defend his comrades, his country, and the revolution."
 TPMP_ROM_german_army_integration: "German Army Integration"
 TPMP_ROM_beg_for_modern_equipment: "Beg for Modern Equipment"
 TPMP_ROM_romanians_make_do: "Romanians Make Do"
 TPMP_ROM_the_1st_wave: "The 1st Wave"
 TPMP_ROM_the_final_push: "The Final Push"
 TPMP_ROM_the_sentinel_of_the_motherland: "The Sentinel of the Motherland"
 TPMP_ROM_the_sentinel_of_the_motherland_desc: "The Straja Ţării has given the crown a foothold among Romania's youth, but slogans alone will not secure the throne. The army itself is where loyalty actually matters, and it is past time the King put his own stamp on it, from the officer corps down to the newest recruit."
 TPMP_ROM_national_conscription_reform: "National Conscription Reform"
 TPMP_ROM_national_conscription_reform_desc: "A bigger army starts with a bigger pool of conscripts, and the current system draws in far fewer men than the country could actually field. Reforming conscription from top to bottom is the surest way to put more soldiers in uniform, and put them there faster."
 TPMP_ROM_dress_to_impress: "Dress to Impress"
 TPMP_ROM_dress_to_impress_desc: "King Carol has never met a lapel he didn't want to add more gold braid to, and the army's new dress uniform has gone through more revisions than the King himself can probably count. Sharp uniforms will not win battles by themselves, but they do wonders for how loyal a soldier feels to the man who dressed him so well."
 TPMP_ROM_loyal_royal_army: "Loyal Royal Army"
 TPMP_ROM_loyal_royal_army_desc: "Quality has its place, but numbers help too, and Romania has never lacked for men willing to fill the ranks. It may never outnumber the Red Army, but a force this size, properly trained and supplied, should finally carry its own weight in the fight to come."
 TPMP_ROM_legion_of_the_archangel_michael: "Legion of the Archangel Michael"
 TPMP_ROM_legion_of_the_archangel_michael_desc: "Codreanu founded this movement as a brotherhood sworn to the Archangel Michael, not a political party, and its truest believers have always been ready to die for it. Turning that devotion into a real army is simply catching up to what they already believe."
 TPMP_ROM_chariots_chariots: "Chariots, Chariots"
 TPMP_ROM_chariots_chariots_desc: "A proper armoured column, however modest next to what the Germans field, gives our infantry something to rally behind besides icons and slogans. Steel argues its own case."
 TPMP_ROM_our_mountain_home: "Our Mountain Home"
 TPMP_ROM_our_mountain_home_desc: "Our men were raised on Romania's mountains, and know every pass and ridgeline better than any general's map ever could. Training them as proper mountain troops only puts to use what they already understand by instinct."
 TPMP_ROM_shock_battalions: "Shock Battalions"
 TPMP_ROM_shock_battalions_desc: "Faith and fanaticism can carry men further than any doctrine written in a staff college. Shock battalions built from the Legion's truest believers charge where trained soldiers would hesitate, and more often than not, they break the line."
 TPMP_ROM_blessed_steel: "Ira Domini"
 TPMP_ROM_blessed_steel_desc: "Ira Domini, the wrath of God, is not a phrase the Legion uses lightly. Let it also describe an army of vânători that holds its ground under pressure and does not break when surrounded."
 TPMP_ROM_echipa_legionara_din_spania: "Echipa Legionară din Spania"
 TPMP_ROM_echipa_legionara_din_spania_desc: "Franco's Spain and Romania are countries of the same cause, Axis brothers in arms, never mind that Romania hasn't officially gotten around to that yet. Sending a few thousand well-equipped Legionaries to fight beside them should make more of a difference to the outcome of the civil war."
 TPMP_ROM_army_modernisation: "Army Modernisation"
 TPMP_ROM_army_modernisation_desc: "Our army fought its last major war with equipment that was already outdated then. A thorough modernization program, however overdue, is the only way to close the gap with what the great powers are now fielding."
 TPMP_ROM_the_orita: "The Oriţa"
 TPMP_ROM_the_orita_desc: "Our engineers believe they can design a submachine gun to rival anything the great powers field. Give the Oriţa proper backing to see that work through, rather than leaving it to languish on someone's drafting table."
 TPMP_ROM_artillery_modenisation: "Artillery Modernisation"
 TPMP_ROM_artillery_modenisation_desc: "Half the guns we would wheel out tomorrow are the same French seventy-fives that fought the last war, and they were already old then. Our infantry deserves artillery built for this war, not the previous one."
 TPMP_ROM_modern_at_guns: "Modern AT Guns"
 TPMP_ROM_modern_at_guns_desc: "The age of the tank has arrived, and our infantry require up-to-date means to defend themselves against these steel behemoths."
 TPMP_ROM_75_mm_resita_model_1943: "75 mm Reşiţa, Model 1943"
 TPMP_ROM_75_mm_resita_model_1943_desc: "Reşiţa's engineers have built something extraordinary: a 75mm gun that outclasses, arguably, every anti-tank gun fielded by anyone ever. Producing it in numbers means no enemy tank will ever threaten our frontlines ever again, probably."
 TPMP_ROM_the_marshal: "The Mareşal"
 TPMP_ROM_the_marshal_desc: "Our engineers have come up with an idea to place captured Soviet 122mm howitzers in an enclosed casemate. By further refining this design, we may well be on our way to create a highly-successful tank model."
 TPMP_ROM_big_shot: "Big Shot"
 TPMP_ROM_big_shot_desc: "Every self-respecting army needs at least one enormous gun mounted on rails, and this one earns its keep. There is no faster way through a fortified line than a well-placed §YBIG SHOT§!."
 TPMP_ROM_army_war_college: "Army War College"
 TPMP_ROM_army_war_college_desc: "We require the brightest minds in command of our military forces, which means the war college must be expanded."
 TPMP_ROM_venatori_de_munte: "Vânători de Munte"
 TPMP_ROM_venatori_de_munte_desc: "The Vanatori De Munte - Mountain Huntsmen - are our elite mountain infantry. Their reputation precedes them, even abroad, and we would do well to bolster their numbers with the best that we can find."
 TPMP_ROM_army_reserves: "Army Reserves"
 TPMP_ROM_army_reserves_desc: "Some armies could lose their first million men and still have several million more waiting behind them. If Romania is ever going to keep pace, our own reserves need building up long before the shooting starts."
 TPMP_ROM_aquire_modern_tanks: "Acquire Modern Tanks"
 TPMP_ROM_aquire_modern_tanks_desc: "The development of tanks continues at a rapid pace, and it will not do to acquire obsolete models."
 TPMP_ROM_a_mobile_alternative: "A Mobile Alternative"
 TPMP_ROM_a_mobile_alternative_desc: "Towed anti-tank guns are useful enough, but slow to reposition once the enemy has found their range. Mounting the gun on a mobile chassis instead lets it keep pace with the line, and disappear before it draws return fire."
 TPMP_ROM_expand_galati_shipyards: "Expand Galaţi Shipyards"
 TPMP_ROM_expand_galati_shipyards_desc: "Our already-existing shipyard facilities at Galaţi must be greatly expanded if we are to project our power into the Black Sea."
 TPMP_ROM_black_sea_dominance: "Black Sea Dominance"
 TPMP_ROM_black_sea_dominance_desc: "The Seahorse Plan's first hulls are sliding off the ways: an undergunned battleship, an old cruiser hull with a flight deck bolted on, and heavy cruisers that are the least embarrassing of the lot. Light cruisers and the same destroyers fill out the rest, but it is, undeniably, a fleet."
 TPMP_ROM_small_natural_tunnel: "World of Warships"
 TPMP_ROM_small_natural_tunnel_desc: "War at sea has always been a thinking man's fight, and we need to think of a way to put our fleet to good use. Whatever the Turks make of a battle line steaming through their front yard, there is no putting it back in the Black Sea now."
 TPMP_ROM_expand_the_airforce: "Expand the Air Force"
 TPMP_ROM_expand_the_airforce_desc: "Modern wars cannot be won without dominating the skies. We must do everything in our power to develop the Romanian air force!"
 TPMP_ROM_trust_in_iar: "Invest in the IAR"
 TPMP_ROM_trust_in_iar_desc: "The IAR works at Braşov have already proven they can build a competent airframe, given the chance. Backing them properly, with money and factory space both, is how Romania gets an air force worth the name."
 TPMP_ROM_iar_80: "IAR 80"
 TPMP_ROM_iar_80_desc: "Our engineers have excellent ideas that they are eager to pour into a new fighter design. They merely need funding and the go-ahead."
 TPMP_ROM_aquire_ju_52s: "New Transport Planes"
 TPMP_ROM_aquire_ju_52s_desc: "Every army eventually needs a way to move men and supplies faster than the rail lines allow, and the Luftwaffe's new Ju 54 transports are exactly the answer. A standing order for two hundred should keep our airborne logistics stocked for a good while."
 TPMP_ROM_allied_expertise: "Procure Fighters"
 TPMP_ROM_allied_expertise_desc: "Whichever of us, ourselves, the Germans, or the Italians, currently has the better fighter design is the one whose blueprints we will build from. Our own factories can turn out the airframes; we just need to be building the right ones."
 TPMP_ROM_allied_blueprints: "Purchase Blueprints"
 TPMP_ROM_allied_blueprints_desc: "Italy is happy to sell us a full set of naval blueprints: hulls, fire control, the works. Whether Romania actually needs any of it is a separate question entirely."
 TPMP_ROM_allied_blueprints_tech_tt: "£GFX_research_icon Unlocks all of Italy's starting naval technology"
 TPMP_ROM_plan_maresesti: "Planul Căluţul de Mare"
 TPMP_ROM_plan_maresesti_desc: "The Seahorse Plan, as it translates, calls for battleships, cruisers, and carriers enough to make any rival on the Black Sea, or even the Mediterranean, think twice. Whether Romania's shipyards, or its budget, can actually deliver any of that is beside the point."
 TPMP_ROM_allied_expertise_tt: "Whichever of §YRomania§!, §YGermany§!, or §YItaly§! holds the most advanced fighter airframe will receive the aircraft; §YRomania§! receives §Y600§!, while §YGermany§! or §YItaly§! would receive §Y400§!; ties are broken in favor of §YRomania§!, then §YGermany§!"
 TPMP_ROM_iar_80_tt: "The §YIAR 80§! is fitted with an §YEngine III§!, three §YHeavy Machine Gun x4§!, an §Yextra fuel tank§!, §Yarmour plating§!, and §Yself-sealing fuel tanks§!"
 TPMP_ROM_black_sea_dominance_strain_tt: "On selection: gain §YFleet Program Strain§!"
 TPMP_ROM_small_natural_tunnel_strain_tt: "On selection: gain §YFleet Program Strain§!"
 TPMP_ROM_small_natural_tunnel_fleet_tt: "Constructs:\n§Y1§! battlecruiser\n§Y1§! heavy cruiser\n§Y2§! light cruisers\n§Y2§! older light cruisers\n§Y8§! destroyers"
 TPMP_ROM_black_sea_dominance_fleet_tt: "Constructs:\n§Y1§! aircraft carrier\n§Y1§! battlecruiser\n§Y3§! heavy cruisers\n§Y4§! light cruisers\n§Y6§! older light cruisers\n§Y12§! destroyers"