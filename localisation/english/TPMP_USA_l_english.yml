 TPMP_USA.5.t: "Cash and Carry Offer"
 TPMP_USA.5.d: "A new US policy has recently come into effect, allowing for the purchase of military equipment as long as we provide immediate payment and transportation of the equipment ourselves.\n\nGiven our dire need for more weapons, it seems prudent to invest in this so called 'Cash and Carry' policy immediately. Now the only question that remains is which area of our military requires equipment the most?"
 TPMP_USA.5.a: "We need modern aircraft."
 TPMP_USA.5.b: "Our men need guns and artillery."
 TPMP_USA.5.c: "More tanks are required."