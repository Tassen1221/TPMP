# USA EVENTS

# Strikes
 TPMP_USA.1.t: "The Flint Sit-Down Strike"
 TPMP_USA.1.desc: "Workers at the General Motors body plant in Flint, Michigan have sat down at their stations and refuse to leave. The strike is spreading through the automotive industry, and with it the United Auto Workers' demand for recognition. Production lines across the country are grinding to a halt.\n\nHow the administration responds will set the tone for labour relations for years to come."
 TPMP_USA.1.a: "There is little we can do."
 TPMP_USA.1.b: "Enforce the Wagner Act!"
 TPMP_USA.2.t: "The Miners' Strike"
 TPMP_USA.2.desc: "The United Mine Workers have walked out of the pits, demanding better wages and conditions. Coal is the lifeblood of our industry, and every day the mines stand idle the furnaces burn lower.\n\nWe can let the strike run its course, lean on the framework of the Wagner Act to negotiate an orderly settlement - or break the strike outright, whatever the political cost."
 TPMP_USA.2.a: "There is little we can do."
 TPMP_USA.2.b: "Enforce the Wagner Act!"
 TPMP_USA.2.c: "Invoke the Smith-Connally Act!"
 TPMP_USA.3.t: "Strike at the Mines"
 TPMP_USA.3.desc: "Fresh unrest is brewing in the coalfields as local unions test the administration's resolve. Organizers are calling for walkouts across the region, and mine operators are demanding federal intervention. For now the situation remains contained, but all sides are watching Washington closely."
 TPMP_USA.3.a: "Contain the unrest."

# Cash and Carry
 TPMP_USA.4.t: "Cash and Carry Offer"
 TPMP_USA.4.desc: "A new US policy has recently come into effect, allowing for the purchase of military equipment as long as we provide immediate payment and transportation of the equipment ourselves.\n\nGiven our dire need for more weapons, it seems prudent to invest in this so called 'Cash and Carry' policy immediately. Now the only question that remains is which area of our military requires equipment the most?"
 TPMP_USA.4.a: "We need modern aircraft."
 TPMP_USA.4.b: "Our men need guns and artillery."
 TPMP_USA.4.c: "More tanks are required."

# Einstein-Szilard Letter
 TPMP_USA.5.t: "The Einstein-Szilard Letter"
 TPMP_USA.5.desc: "A letter signed by Albert Einstein and drafted with the physicist Leo Szilard has reached the President's desk. It warns that recent advances in nuclear physics could allow for a new type of bomb of almost unimaginable power, and that Germany may already be pursuing one. The scientists urge the administration to secure uranium supplies and support American research before it is too late."
 TPMP_USA.5.a: "This warrants attention."

# Roosevelt Recession
 TPMP_USA.6.t: "The Roosevelt Recession"
 TPMP_USA.6.desc: "The economy has stumbled back into crisis. With federal spending cut back and monetary policy tightened, industrial production is falling and unemployment is climbing toward Depression-era levels. Critics in both parties are already calling it the Roosevelt Recession, and the administration has little choice but to ride out the storm."
 TPMP_USA.6.a: "We have been here before."
 TPMP_USA.7.t: "Signs of Recovery"
 TPMP_USA.7.desc: "The worst of the downturn appears to be passing. Factory orders are climbing again, hiring has resumed across the industrial belt, and confidence is slowly returning to the markets. Recovery will not come overnight, but each month puts the economy a little further from the brink."
 TPMP_USA.7.a: "Steady as she goes."

# Elections
 TPMP_USA_election.1.t: "The Campaign Season Begins"
 TPMP_USA_election.1.desc: "November approaches, and with it another presidential election. Across the country the party machines are stirring to life, and the calendar is filling with rallies, radio addresses and whistle-stop tours. It is time to take the administration's case to the American people."
 TPMP_USA_election.1.a: "To the campaign trail!"
 TPMP_USA_election.2.t: "The Election of 1936"
 TPMP_USA_election.2.desc: "The votes have been counted and the results are in. President Roosevelt has been returned to the White House, but the scale of his victory will decide how much political capital the administration carries into the next term. Now the work of governing begins anew."
 TPMP_USA_election.2.a: "A landslide victory!"
 TPMP_USA_election.2.b: "A comfortable win."
 TPMP_USA_election.2.c: "A narrow victory."
 TPMP_USA_election.2.d: "A hollow mandate."
 TPMP_USA_election.3.t: "The Election of 1940"
 TPMP_USA_election.3.desc: "The votes have been counted and the results are in. Breaking with a tradition as old as the Republic itself, the President has secured a third term, though the scale of the victory will determine the strength of his mandate. Now the work of governing begins anew."
 TPMP_USA_election.3.a: "A landslide victory!"
 TPMP_USA_election.3.b: "A comfortable win."
 TPMP_USA_election.3.c: "A narrow victory."
 TPMP_USA_election.3.d: "A hollow mandate."
 TPMP_USA_election.4.t: "The Election of 1944"
 TPMP_USA_election.4.desc: "The votes have been counted and the results are in. With the nation locked in a global struggle, the electorate has once again chosen continuity, though the margin will shape the administration's authority in the years ahead. Now the work of governing begins anew."
 TPMP_USA_election.4.a: "A landslide victory!"
 TPMP_USA_election.4.b: "A comfortable win."
 TPMP_USA_election.4.c: "A narrow victory."
 TPMP_USA_election.4.d: "A hollow mandate."
 TPMP_USA_election.5.t: "The Midterm Elections"
 TPMP_USA_election.5.desc: "Halfway through the presidential term, the nation has gone to the polls to elect a new Congress. As is so often the case, the party holding the White House has lost ground, and the opposition returns to Washington emboldened. The administration will have to work that much harder to push its agenda through the new Congress."
 TPMP_USA_election.5.a: "The pendulum swings."
 TPMP_USA_election.6.t: "The 1940 Ticket"
 TPMP_USA_election.6.desc: "The party convention must settle the question of the Vice Presidency before the campaign begins in earnest. John Nance Garner has grown openly hostile to the New Deal, and many in the party are pressing for a loyalist in his place. The choice of running mate will send a clear signal about the direction of a third term."
 TPMP_USA_election.6.a: "Retain Vice President Garner."
 TPMP_USA_election.6.b: "Nominate Henry Wallace."
 TPMP_USA_election.7.t: "The 1944 Ticket"
 TPMP_USA_election.7.desc: "Once again the convention must choose a running mate before the general election. Party leaders are quietly maneuvering over the Vice Presidency, well aware that whoever stands beside the President may one day succeed him. The decision will shape the ticket, and perhaps the nation's future."
 TPMP_USA_election.7.a: "Retain Vice President Garner."
 TPMP_USA_election.7.b: "Retain Vice President Wallace."
 TPMP_USA_election.7.c: "Nominate Harry Truman."

# Congress Lobbying Efforts
 TPMP_USA_congress.4.t: "Small Arms Lobbying Effort"
 TPMP_USA_congress.4.desc: "A bloc in Congress is pressing the administration to build up the Army's stocks of rifles, artillery and supporting equipment. Their spokesmen argue that a nation that cannot arm its own soldiers has no business speaking of preparedness. Meeting their targets would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.4.a: "Worth consideration."
 TPMP_USA_congress.4.b: "Veto the effort."
 TPMP_USA_congress.5.t: "Armored Vehicle Lobbying Effort"
 TPMP_USA_congress.5.desc: "Advocates of mechanization in Congress are demanding a serious buildup of the Army's tank stocks. They point to developments in Europe as proof that the horse has had its day, and that America cannot afford to fall behind. Meeting their targets would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.5.a: "Worth consideration."
 TPMP_USA_congress.5.b: "Veto the effort."
 TPMP_USA_congress.6.t: "Aircraft Lobbying Effort"
 TPMP_USA_congress.6.desc: "Air power enthusiasts in Congress are calling for a major expansion of the nation's combat air fleets. They insist that the next war will be decided in the skies, and that America's aviation industry must be put to work now. Meeting their targets would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.6.a: "Worth consideration."
 TPMP_USA_congress.6.b: "Veto the effort."
 TPMP_USA_congress.7.t: "Naval Lobbying Effort"
 TPMP_USA_congress.7.desc: "The Navy's friends in Congress are demanding a larger fleet, both capital ships and the screens to protect them. A two-ocean nation, they argue, needs a two-ocean navy, and the shipyards are ready for the work. Meeting their targets would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.7.a: "Worth consideration."
 TPMP_USA_congress.7.b: "Veto the effort."
 TPMP_USA_congress.8.t: "Military Industry Lobbying Effort"
 TPMP_USA_congress.8.desc: "A coalition in Congress wants to see the nation's arms industry expanded, with new military factories and dockyards breaking ground. They argue that industrial capacity is the true measure of military power, and that America's must grow. Meeting their targets would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.8.a: "Worth consideration."
 TPMP_USA_congress.8.b: "Veto the effort."
 TPMP_USA_congress.9.t: "Civilian Industry Lobbying Effort"
 TPMP_USA_congress.9.desc: "Members from the industrial states are pushing for investment in civilian industry and infrastructure. New factories and better transport links, they argue, will put men back to work and lay the foundation for future prosperity. Meeting their targets would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.9.a: "Worth consideration."
 TPMP_USA_congress.9.b: "Veto the effort."
 TPMP_USA_congress.10.t: "Political Capital Lobbying Effort"
 TPMP_USA_congress.10.desc: "Senior figures in Congress want proof that the administration can exercise restraint and husband its political resources. Holding a healthy reserve of political capital, they argue, is the mark of a White House in control of its agenda. Demonstrating that discipline would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.10.a: "Worth consideration."
 TPMP_USA_congress.10.b: "Veto the effort."
 TPMP_USA_congress.11.t: "Political Appointment Lobbying Effort"
 TPMP_USA_congress.11.desc: "Party grandees are pressing the administration to fill out its cabinet with capable and well-connected men. A full bench of advisors, they argue, shows a White House that takes governing seriously. Satisfying their expectations would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.11.a: "Worth consideration."
 TPMP_USA_congress.11.b: "Veto the effort."
 TPMP_USA_congress.12.t: "Technology Lobbying Effort"
 TPMP_USA_congress.12.desc: "Forward-looking members of Congress are demanding that America keep its edge in science and engineering. They want to see the nation's laboratories and universities delivering results, not falling behind the dictatorships. Meeting their expectations would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.12.a: "Worth consideration."
 TPMP_USA_congress.12.b: "Veto the effort."
 TPMP_USA_congress.13.t: "Stability Lobbying Effort"
 TPMP_USA_congress.13.desc: "Moderates in both parties want the administration to calm the country's social and political tensions. A stable and contented nation, they argue, is worth more than any single piece of legislation. Keeping the peace at home would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.13.a: "Worth consideration."
 TPMP_USA_congress.13.b: "Veto the effort."
 TPMP_USA_congress.14.t: "Industrialist Lobbying Effort"
 TPMP_USA_congress.14.desc: "The nation's industrialists have taken their case to Congress, demanding policies that raise the output of America's factories. Their allies argue that efficient industry serves everyone, from the shop floor to the boardroom. Delivering the goods would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.14.a: "Worth consideration."
 TPMP_USA_congress.14.b: "Veto the effort."
 TPMP_USA_congress.15.t: "War Hawk Lobbying Effort"
 TPMP_USA_congress.15.desc: "The interventionist wing of Congress wants the administration to prepare the public for the conflicts ahead. They argue that a nation unwilling to fight will one day be forced to, on far worse terms. Rallying the country's willingness for war would earn the administration real goodwill on the Hill."
 TPMP_USA_congress.15.a: "Worth consideration."
 TPMP_USA_congress.15.b: "Veto the effort."
 TPMP_USA_congress.16.t: "New-Deal Coalition Lobbying Effort"
 TPMP_USA_congress.16.desc: "The administration's own allies are asking for proof that the New-Deal coalition still commands the floor. Holding the loyalty of the President's congressional base, they argue, is the foundation on which everything else is built. Keeping the coalition strong would earn goodwill from every corner of the Hill."
 TPMP_USA_congress.16.a: "Worth consideration."
 TPMP_USA_congress.16.b: "Veto the effort."

