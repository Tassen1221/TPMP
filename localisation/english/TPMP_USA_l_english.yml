 TPMP_USA_elections_category: "Presidential Election"
 TPMP_USA_elections_category_desc: "Every November, citizens of the United States across the country vote for their next president. Although the outcome is decided in a single night, the campaigning season leading up to the election can last for months. During this time, candidates rally support across the nation, targetting key constituencies to build their winning coalition.\n\nThe current incumbent is: §Y[USA.GetLeader]§!, his wide popularity makes winning the election a foregone conclusion, however, the degree of his victory is yet to be determined.\n\nGetting over §Y75 Electoral Support§! is nessecary to win a landslide victory, getting less than §Y75§!, §Y50§! or §Y25§! §YElectoral Support§! will result in an increasingly narrow victory with §Rpenalties§!.\n\nYour starting §YSupport§! is one-third of your §nNew-Deal Democrat§! Support."

