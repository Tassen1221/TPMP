 TPMP_USA_congress_category_desc: "The United States Congress is the legislative body of the United States government, maintaining its support is necessary for any president who wishes to implement their policies and agenda. Two parties, the Democrats and Republicans hold power within congress, however, each party is divided into various factions with their own unique priorities."
