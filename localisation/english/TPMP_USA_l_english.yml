 TPMP_USA_alphabet_category_desc: "The New Deal's relief and recovery agencies - known by their many acronyms - put millions of Americans to work on projects across the nation."
 TPMP_USA_deficit_category: "Budget Management"
 TPMP_USA_deficit_category_desc: "With the budget under executive management, the government can direct the nation's finances as it sees fit - raising revenue, funding programs, and if need be, spending beyond its means. Every choice shapes the balance sheet, and a government that borrows today must answer for its debts tomorrow."
