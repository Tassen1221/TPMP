 TPMP_USA.1.t: "The Flint Sit-Down Strike"
 TPMP_USA.1.d: "Workers at the General Motors body plant in Flint, Michigan have sat down at their stations and refuse to leave. The strike is spreading through the automotive industry, and with it the United Auto Workers' demand for recognition. Production lines across the country are grinding to a halt.\n\nHow the administration responds will set the tone for labour relations for years to come."
 TPMP_USA.1.a: "There is little we can do."
 TPMP_USA.1.b: "Enforce the Wagner Act!"
 TPMP_USA.2.t: "The Miners' Strike"
 TPMP_USA.2.d: "The United Mine Workers have walked out of the pits, demanding better wages and conditions. Coal is the lifeblood of our industry, and every day the mines stand idle the furnaces burn lower.\n\nWe can let the strike run its course, lean on the framework of the Wagner Act to negotiate an orderly settlement - or break the strike outright, whatever the political cost."
 TPMP_USA.2.a: "There is little we can do."
 TPMP_USA.2.b: "Enforce the Wagner Act!"
 TPMP_USA.2.c: "Invoke the Smith-Connally Act!"

 TPMP_USA.4.t: "Cash and Carry Offer"
 TPMP_USA.4.d: "A new US policy has recently come into effect, allowing for the purchase of military equipment as long as we provide immediate payment and transportation of the equipment ourselves.\n\nGiven our dire need for more weapons, it seems prudent to invest in this so called 'Cash and Carry' policy immediately. Now the only question that remains is which area of our military requires equipment the most?"
 TPMP_USA.4.a: "We need modern aircraft."
 TPMP_USA.4.b: "Our men need guns and artillery."
 TPMP_USA.4.c: "More tanks are required."

