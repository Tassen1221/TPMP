 TPMP_pacific_front_decision_category: "The Pacific Theatre"
 TPMP_pacific_front_decision_category_desc: "The Pacific Ocean, over 160 million square kilometers in area, is the largest geographical entity on the planet. Control over this vast front can only be achieved through the occupation of various strategically vital islands and areas.\n\nThe following islands contribute to industry and attack debuffs to Japan or The United States depending on who controls them:\n\n§YAleutian Islands§!: [1047.TPMP_pacific_front_controller_loc]\n§YAttu Island§!: [650.TPMP_pacific_front_controller_loc]\n§YIwo Jima§!: [645.TPMP_pacific_front_controller_loc]\n§YMarcus Island§!: [648.TPMP_pacific_front_controller_loc]\n§YWake Island§!: [632.TPMP_pacific_front_controller_loc]\n§YMidway Island§!: [631.TPMP_pacific_front_controller_loc]\n§YPalau§!: [647.TPMP_pacific_front_controller_loc]\n§YCaroline Islands§!: [684.TPMP_pacific_front_controller_loc]\n§YGuam§!: [638.TPMP_pacific_front_controller_loc]\n§YSaipan§!: [646.TPMP_pacific_front_controller_loc]\n§YMarshall Islands§!: [633.TPMP_pacific_front_controller_loc]\n§YJohnston Atoll§!: [630.TPMP_pacific_front_controller_loc]\n§YPhoenix Island§!: [642.TPMP_pacific_front_controller_loc]\n§YLine Islands§!: [727.TPMP_pacific_front_controller_loc]\n§YBismarck§!: [737.TPMP_pacific_front_controller_loc]\n§YSolomon Islands§!: [634.TPMP_pacific_front_controller_loc]\n\nThe following strategic areas contribute special bonuses to Japan or The United States depending on who controls them:\n\n§YThe Phillippines§!: [327.TPMP_pacific_front_controller_loc]\n§YSingapore§!: [336.TPMP_pacific_front_controller_loc]\n§YNew Guinea§!: [523.TPMP_pacific_front_controller_loc]\n§YHawaii§!: [629.TPMP_pacific_front_controller_loc]\n§YOkinawa§!: [526.TPMP_pacific_front_controller_loc]\n§YFormosa§!: [524.TPMP_pacific_front_controller_loc]\n§YPanama§!: [685.TPMP_pacific_front_controller_loc]\n§YAlaska§!: [463.TPMP_pacific_front_controller_loc]"

