l_english:
 FRA_ask_allies_for_resource_aid: "Ask Allies for Resource Aid"
 FRA_ask_allies_for_resource_aid_desc: "We are a government in exile, stripped of our industrial heartland. But our allies have resources to spare, and our cause is their cause. By formally appealing to the Allied powers for material support, we can secure the raw materials and industrial output necessary to keep the Free French war effort alive."

 TPMP_FRA_resources_idea: "Allied Resource Commitment"
 TPMP_FRA_resources_idea_desc: "Our allies have pledged to keep the Free French forces supplied. Steady shipments of raw materials and industrial goods flow into our war economy, easing the burden of fighting without a homeland."

 FRA_the_free_french_navy: "The Free French Navy"
 FRA_the_free_french_navy_desc: "Much of France's fleet escaped the armistice intact. Sailors who refused to submit to Vichy found their way to our ports and raised the Cross of Lorraine above their hulls. We must now forge these scattered vessels into a coherent fighting force loyal to Free France."

 FRA_submarine_infancy: "Submarine Warfare"
 FRA_submarine_infancy_desc: "France possesses a small but capable submarine fleet. Rather than contest the surface lanes where the Axis holds advantage, we will develop our undersea capabilities and wage a war of attrition beneath the waves."

 FRA_light_ship_dominance: "Light Ship Dominance"
 FRA_light_ship_dominance_desc: "Speed and maneuverability are the hallmarks of the French light fleet. We will invest in destroyers and light cruisers to assert control over the Mediterranean and the Atlantic approaches, screening convoys and hunting enemy surface raiders."

 FRA_selective_targeting: "Selective Targeting"
 FRA_selective_targeting_desc: "Our submarine commanders are trained to be patient — to study convoy patterns, avoid escorts, and strike only when the odds are in their favour. This doctrine produces fewer sinkings than brute aggression, but far fewer losses in return."

 FRA_rip_and_tear: "Rip and Tear"
 FRA_rip_and_tear_desc: "The war at sea demands aggression. Our submarine and surface forces will coordinate relentless pressure on enemy supply lines, accepting higher risk in exchange for maximum disruption. The enemy must never feel safe on any stretch of water."

 FRA_spam_everything: "Fleet Expansion"
 FRA_spam_everything_desc: "We will expand our light fleet as rapidly as possible. Quantity has a quality of its own — a swarm of fast, well-armed light vessels can overwhelm heavier opposition through sheer numbers and force the enemy onto the defensive."

 FRA_carrier_fighting: "Carrier Doctrine"
 FRA_carrier_fighting_desc: "Air power at sea is the deciding factor of this war. We will construct a fleet carrier and develop the doctrine to use it, projecting French airpower far beyond the reach of any land-based fighter and turning the tide of naval battles in our favour."

 FRA_submarine_fleet: "Submarine Force"
 FRA_submarine_fleet_desc: "The Free French submarine arm has been organized and put to active use. Our boats range across open ocean, striking at Axis supply lines and returning to port with hard-won experience."

 FRA_light_focus: "Light Fleet Priority"
 FRA_light_focus_desc: "Free France is investing its naval resources into a fleet of fast, agile light warships. Construction and operational costs are reduced, and our ships can cover ground faster than any comparable Axis force."

 FRA_sneaky_subs: "Silent Service"
 FRA_sneaky_subs_desc: "Our submarine crews have mastered the art of the silent approach. Running quiet and deep, they slip past escorts undetected and deliver their torpedoes at point-blank range before disappearing back into the depths."

 FRA_until_done: "Guerre a Outrance"
 FRA_until_done_desc: "Free France wages total war at sea. Our submarines and surface units operate in aggressive coordination, burning through fuel and munitions at a relentless pace to deny the enemy any respite on the water. The sea belongs to those willing to fight for it without limits."

 FRA_light_navy: "La Royale Legere"
 FRA_light_navy_desc: "A fully realized light fleet doctrine has taken hold in the Free French Navy. Our destroyers and light cruisers operate with exceptional speed and cohesion, outmaneuvering heavier opponents and dominating the convoy lanes."

 FRA_colonial_recruitment: "Colonial Recruitment"
 FRA_colonial_recruitment_desc: "The peoples of the French Empire have answered the call. Recruiters operate across West Africa, North Africa, and the Levant, channelling a steady stream of volunteers and conscripts into the Free French order of battle."

 FRA_heavy_armour: "Armoured Spearhead"
 FRA_heavy_armour_desc: "The lessons of 1940 are not forgotten. We will build our reformed forces around armour — well-equipped tank units capable of the kind of decisive offensive action that the old army failed to deliver. Our colonial infantry will provide the mass; our armour will provide the punch."

 FRA_bravo_six: "Infantry Excellence"
 FRA_bravo_six_desc: "The backbone of our army has always been the French infantryman. Well-drilled, well-equipped, and supported by artillery and anti-armour weapons, our foot soldiers will be more than a match for anything the enemy puts in front of them."

 FRA_factory_recruitment_light: "Reintegration: Industry First"
 FRA_factory_recruitment_light_desc: "As our colonial forces mature, we redirect a portion of their manpower and logistical networks into supporting industrial output. Lighter industrial commitments mean we can sustain both production and manpower simultaneously, if at a modest scale."

 FRA_factory_recruitment_heavy: "Reintegration: Total Mobilization"
 FRA_factory_recruitment_heavy_desc: "We throw our full colonial logistical network behind industrial production. The gains are substantial — factories run around the clock and output climbs sharply — but this comes at the cost of our non-core manpower pool, which is redirected wholesale into the war economy."

 FRA_french_armour: "Troupes Blindees"
 FRA_french_armour_desc: "A dedicated armoured corps has been built around the colonial base. Tank production is streamlined, motorized infantry supports the advance, and special forces leverage the mobility of the armoured spearhead."

 FRA_john_infantryman: "Le Poilu Nouveau"
 FRA_john_infantryman_desc: "Our reformed infantry arm is better equipped and better supported than the army that fell in 1940. Rifles, machine guns, artillery, anti-tank weapons, and anti-aircraft guns are all produced in greater quantities and issued down to the lowest level."

 FRA_factory_bolster_light: "Colonial Industry (Light)"
 FRA_factory_bolster_light_desc: "Colonial manpower networks have been repurposed to feed a modest expansion of our industrial base. Factory output rises and consumer goods requirements ease slightly, while colonial troops continue to serve in smaller but still meaningful numbers."

 FRA_factory_bolster_heavy: "Colonial Industry (Heavy)"
 FRA_factory_bolster_heavy_desc: "The full weight of the colonial mobilization has been turned toward industry. Production output rises dramatically and consumer goods requirements drop sharply — but this comes at the cost of our non-core manpower, which is no longer available for frontline service."
