l_english:
 TPMP_GER.1.t: "Fall Blau"
 TPMP_GER.1.d: "Summer has returned, and with it a chance to seize the strategic initiative. Our supplies and reinforcements are constrained, permitting an offensive only along a narrow frontage. Given these limitations, toward which axis should our operation be directed?"
 TPMP_GER.1.a: "Strike towards Arkhangelsk"
 TPMP_GER.1.b: "Strike towards Kazan"
 TPMP_GER.1.c: "Strike towards Baku"
 add_axis_eastern_front_remover_dynamic_modifier_tt: "Removes $TPMP_eastern_front_modifier_0$ effect for §Y150 days§!."

 TPMP_AST.1.t: "Australian Occupation of the Dutch East Indies"
 TPMP_AST.1.d: "With the collapse of the Dutch government in Europe, the Dutch East Indies have declared loyalty to the government-in-exile and the allied war effort. However, as the Dutch government is no longer capable of guaranteeing the security of the region, negotiations have taken place to allow Australian forces to occupy and administer the territory for the duration of the war."
 TPMP_AST.1.a: "We accept the responsibility."
 
 TPMP_GEN.1.t: "Anglo-Soviet Occupation of Iran"
 TPMP_GEN.1.d: "Anglo-Soviet invasion of Iran has ended and the Persian corridor is secured. We can occupy the previously agreed on concessions or we can let the british continue occupying our designated zone until further notice."
 TPMP_GEN.1.a: "Occupy the concession"
 TPMP_GEN.1.b: "Let the British handle it"

 TPMP_GEN.2.t: "A Peaceful Conference Regarding Transylvania"
 TPMP_GEN.2.d: "Hungary, our ever so graceful ally has demanded the return of the currently disputed territory of Transylvania. Knowing the importance of inter Axis cooperation they have made clear that war between our countries is not an option and they are willing to settle for as little as Northern Transylvania, however they would prefer a full return to the pre Trianon borders. How should we respond"
 TPMP_GEN.2.a: "Lets Compromise with just Northern Transylvania"
 TPMP_GEN.2.b: "Return the entirety of Transylvania"
 TPMP_GEN.2.c: "Lets ask for Germans mediation, maybe they'll let us keep all of it"

 TPMP_GEN.3.t: "German Mediation"
 TPMP_GEN.3.d: "Our moronic balkan allies are arguing about stupid land disputes again, since we are the leader of the Axis our words are final. What is the fate of Transylvania"
 TPMP_GEN.3.a: "Hungary Shall have only Northern Transylvania"  
 TPMP_GEN.3.b: "Hungary Shall have the entirety of Transylvania"
 TPMP_GEN.3.c: "Romania shall retain Transylvania"