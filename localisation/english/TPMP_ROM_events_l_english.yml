l_english:
 TPMP_ROM.1.t: "Election Day"
 TPMP_ROM.1.d: "Across the country, from the boulevards of Bucharest to the smallest village square, Romanians are lining up at the polls. Ballots will be cast, and the democratic process left to take its course."
 TPMP_ROM.1.a: "To the polls"

 TPMP_ROM.5.t: "Romania redirects effort to naval expansion"
 TPMP_ROM.5.d: "Bucharest has announced a naval expansion program wildly out of proportion to its coastline, its budget, or any conceivable strategic need. Foreign analysts have politely asked what, exactly, Romania intends to do with this fleet; the Ministry's answer amounts to 'build it and see.' Economists warn the economy will not survive contact with this plan. A London naval analyst reportedly laughed so hard he needed to be hospitalized. The shipyards, in any case, are already at work."
 TPMP_ROM.5.a: "Rule România, România rule the waves!"
 TPMP_ROM.5.b: "What are they thinking!"

 TPMP_ROM.2.t: "Election Results"
 TPMP_ROM.2.d: "The count is in, and it is exactly the mess everyone feared: no party has come close to a governing majority, and the old Liberal machine has bled support to the extremes on both sides. With Parliament deadlocked and the government unable to form, the King steps in himself. Rather than call on the largest bloc, he hands the mandate to Octavian Goga and his National Christian Party."
 TPMP_ROM.2.a: "By the King's decree"

 TPMP_ROM.3.t: "A Romania Unready"
 TPMP_ROM.3.d: "It has now been over a year since the world began sliding toward war, and Romania's economy is still sitting exactly where it was when the clock started: unmobilized, unprepared, and acting as if the game hasn't run for over a year. The General Staff has noticed. A government that cannot be bothered to put the country on a war footing a full year in is not one the army intends to keep indulging forever."
 TPMP_ROM.3.a: "§RLooks like there's only one way through this mess§!"
 TPMP_ROM.3.a.tt: "You failed to achieve partial mobilisation in time and have been locked to Antonescu's path. Glory to the Tryhard party!"

 TPMP_ROM.4.t: "The Second Vienna Award"
 TPMP_ROM.4.d: "Berlin and Rome have spoken. With German and Italian arbitrators having heard both Budapest's and Bucharest's claims to Transylvania, the verdict is delivered without room for appeal: Northern Transylvania is to be transferred to Hungary, effective immediately. Weakened, isolated, and with no allies willing to back its case, Romania is in no position to refuse."
 TPMP_ROM.4.a: "So be it"

 TPMP_ROM.6.t: "Scandal Clouds Romanian Arms Deal"
 TPMP_ROM.6.d: "Romania's foreign minister, Nicolae Titulescu, has concluded his arms-buying tour of Western Europe, and the first shipments have reached Bucharest amid considerable fanfare. According to officers present at the unloading, the crates hold little beyond infantry rifles - no machine guns, no grenades - while the artillery, anti-air, and anti-tank guns bought alongside them turn out to be exactly what their previous owners were glad to finally be rid of.\n\nOpposition newspapers are already asking where the rest of the money went, and why nobody replaced Titulescu months ago, back when they still had the chance."
 TPMP_ROM.6.a: "We got what we paid for, apparently"
 TPMP_ROM.6.b: "Romania's arms budget takes a curious detour"

 TPMP_ROM.7.t: "Unlimited Tanks, But No Tanks"
 TPMP_ROM.7.d: "The newly raised divisions look formidable on paper and considerably less so in the motor pool, where several units are still waiting on tanks that exist only as line items in a budget. The General Staff has drawn up a shortlist of everyone currently building anything worth driving - the list is short, and Bucharest is not proud about who's on it."
 TPMP_ROM.7.a: "Rely on our own industry"
 TPMP_ROM.7.b: "Request tanks from Germany"
 TPMP_ROM.7.c: "Request tanks from Italy"
 TPMP_ROM.7.e: "Request tanks from Hungary"
 TPMP_ROM.7.f: "Request tanks from Bulgaria"
 TPMP_ROM.7.g: "Nevermind, we'll revisit this later"
 TPMP_ROM.7.g.tt: "§RNo one in our faction has a medium tank design, how unfortunate.§!"

 TPMP_ROM.8.t: "Fresh Off the Kriegsspiel Table"
 TPMP_ROM.8.d: "Someone on the General Staff has clearly been spending too many evenings hunched over the kriegsspiel table and now insists Romania needs a real armored division to match his sand-table victories - tanks, crews, the works. Whether anyone in the faction has actually designed a decent medium tank remains to be seen."
 TPMP_ROM.8.a: "Rely on our own industry"
 TPMP_ROM.8.b: "Request tanks from Germany"
 TPMP_ROM.8.c: "Request tanks from Italy"
 TPMP_ROM.8.e: "Request tanks from Hungary"
 TPMP_ROM.8.f: "Request tanks from Bulgaria"
 TPMP_ROM.8.g: "Nevermind, we'll revisit this later"
 TPMP_ROM.8.g.tt: "§RNo one in our faction has a medium tank design, how unfortunate.§!"
