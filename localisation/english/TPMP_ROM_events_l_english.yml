l_english:
 TPMP_ROM.1.t: "Election Day"
 TPMP_ROM.1.d: "Across the country, from the boulevards of Bucharest to the smallest village square, Romanians are lining up at the polls. Ballots will be cast, and the democratic process left to take its course."
 TPMP_ROM.1.a: "To the polls"

 TPMP_ROM.5.t: "Romania redirects effort to naval expansion"
 TPMP_ROM.5.d: "Bucharest has announced a naval expansion program wildly out of proportion to its coastline, its budget, or any conceivable strategic need. Foreign analysts have politely asked what, exactly, Romania intends to do with this fleet; the Ministry's answer amounts to 'build it and see.' Economists warn the economy will not survive contact with this plan. A London naval analyst reportedly laughed so hard he had to leave the briefing room. The shipyards, in any case, are already at work."
 TPMP_ROM.5.a: "Rule România, România rule the waves!"
 TPMP_ROM.5.b: "What are they thinking!"

 TPMP_ROM.2.t: "Election Results"
 TPMP_ROM.2.d: "The count is in, and it is exactly the mess everyone feared: no party has come close to a governing majority, and the old Liberal machine has bled support to the extremes on both sides. With Parliament deadlocked and the government unable to form, the King steps in himself. Rather than call on the largest bloc, he hands the mandate to Octavian Goga and his National Christian Party - a government of the King's choosing, not the electorate's."
 TPMP_ROM.2.a: "By the King's decree"

 TPMP_ROM.3.t: "A Romania Unready"
 TPMP_ROM.3.d: "It has now been over a year since the world began sliding toward war, and Romania's economy is still sitting exactly where it was when the clock started: unmobilized, unprepared ,and acting as if the game hasnt ran for over a year. The General Staff has noticed. A government that cannot be bothered to put the country on a war footing a full year in is not one the army intends to keep indulging forever."
 TPMP_ROM.3.a: "§RLooks like theres only one way through this mess§!"
 TPMP_ROM.3.a.tt: "You failed to achieve partial mobilisation in time and has been locked to Antonescu's path. Glory to the Tryhard party!"

 TPMP_ROM.4.t: "The Second Vienna Award"
 TPMP_ROM.4.d: "Berlin and Rome have spoken. With German and Italian arbitrators having heard both Budapest's and Bucharest's claims to Transylvania, the verdict is delivered without room for appeal: Northern Transylvania is to be transferred to Hungary, effective immediately. Weakened, isolated, and with no allies willing to back its case, Romania is in no position to refuse."
 TPMP_ROM.4.a: "So it is decreed"
