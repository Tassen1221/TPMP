 TPMP_SOV_mon_trait_m_kaganovich:0 "Lazar's brother; aviation, and aware of it."
 TPMP_SOV_mon_trait_machines_head:0 "Builds the machines that build the machines."
 TPMP_SOV_mon_trait_malyshev:0 "Tank builder with the ear of the Kharkov designers."
 TPMP_SOV_mon_trait_nkvd_builder:0 "Labour is cheap when it is not paid."
 TPMP_SOV_mon_trait_pavlov:0 "Armour directorate; loves the tank corps."
 TPMP_SOV_mon_trait_pervukhin:0 "Power stations before everything."
 TPMP_SOV_mon_trait_sergeyev:0 "Shells and powder."
 TPMP_SOV_mon_trait_shakhurin:0 "Aviation industry organiser."
 TPMP_SOV_mon_trait_smushkevich:0 "Air Force chief, Spain veteran."
 TPMP_SOV_mon_trait_steel_head:0 "A heavy-industry man; reliable until he is not."
 TPMP_SOV_mon_trait_tevosyan:0 "Shipyards and steel armour."
 TPMP_SOV_mon_trait_ustinov:0 "The young man who will outlive them all."
 TPMP_SOV_mon_trait_vannikov:0 "Armaments organiser; blunt, effective, politically exposed."
 TPMP_SOV_mon_trait_zaltsman:0 "Runs the tank plants like a barracks."
 TPMP_SOV_mon_tt_arrest:0 "Arrest: his sway leaves the Plan and his successor takes the post. Costs stability, yields [?SOV.TPMP_SOV_mon_cfg_arrest_workers|0] workers, raises paranoia. If a plot was ripening it is exposed at once."
 TPMP_SOV_mon_tt_dismiss:0 "Dismiss the proposal. No cost, no punishment."
 TPMP_SOV_mon_tt_ear_clear:0 "Remove the holder of this ear (free, unless locked)."
 TPMP_SOV_mon_tt_ear_put:0 "Put this candidate in this ear. Eligible: [?SOV.TPMP_SOV_mon_cfg_ear_appoint_pp|0] PP. Not eligible: Stalin forces it for [?SOV.TPMP_SOV_mon_cfg_ear_force_pp|0] PP."
 TPMP_SOV_mon_tt_nkvd:0 "NKVD investigation: lowers his sway by [?SOV.TPMP_SOV_mon_cfg_nkvd_sway|0], yields [?SOV.TPMP_SOV_mon_cfg_nkvd_workers|0] workers, raises paranoia a little. Needs the NKVD focus."
 TPMP_SOV_mon_tt_pick:0 "Choose this offer. The other two heads feel passed over. Stalin's will: a second offer costs [?SOV.TPMP_SOV_mon_cfg_desk_second_offer_pp|0] PP extra."
 TPMP_SOV_mon_tt_rebuke:0 "Rebuke: costs [?SOV.TPMP_SOV_mon_cfg_rebuke_pp|0] political power and lowers his sway by [?SOV.TPMP_SOV_mon_cfg_rebuke_sway|0]."
