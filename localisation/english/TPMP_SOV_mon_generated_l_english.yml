 TPMP_SOV_mon_prop_p01_desc:0 "The Plan wants steel, and the Vozhd wants it soon. Three commissars have a way to deliver."
 TPMP_SOV_mon_prop_p01_title:0 "Stalin wants more steel"
 TPMP_SOV_mon_prop_p02_desc:0 "Electricity for the new plants and the new cities. Who will carry it out?"
 TPMP_SOV_mon_prop_p02_title:0 "Stalin wants the cities lit"
 TPMP_SOV_mon_prop_p03_desc:0 "Too many sites stand idle waiting for cement and cranes."
 TPMP_SOV_mon_prop_p03_title:0 "Stalin wants faster building"
 TPMP_SOV_mon_prop_p04_desc:0 "The artillery park is obsolete. The GAU, the plants and the arsenal each have an answer."
 TPMP_SOV_mon_prop_p04_title:0 "The army needs a new divisional gun"
 TPMP_SOV_mon_prop_p05_desc:0 "The Spanish war showed what a shell does to our armour."
 TPMP_SOV_mon_prop_p05_title:0 "Our tanks are too thin"
 TPMP_SOV_mon_prop_p06_desc:0 "Spain again: the Messerschmitts fly rings around our fighters."
 TPMP_SOV_mon_prop_p06_title:0 "Our fighters are outclassed"
 TPMP_SOV_mon_prop_p07_desc:0 "The rifle is not enough. Who feeds the rifle companies?"
 TPMP_SOV_mon_prop_p07_title:0 "The infantry needs automatic weapons"
 TPMP_SOV_mon_prop_p08_desc:0 "Finland is a matter of time. The border districts need their stores."
 TPMP_SOV_mon_prop_p08_title:0 "Prepare for war in the north"
