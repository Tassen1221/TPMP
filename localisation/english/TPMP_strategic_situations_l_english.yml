 TPMP_strat_eastern_left: "Test text for the left side on the Eastern Front.\n\nThis box holds the information for the faction shown above it. The text is deliberately long, so the wrapping and the height of the box can be checked.\n\nFirst test line.\nSecond test line.\nThird test line."
 TPMP_strat_eastern_middle: "Test text for neutral information on the Eastern Front.\n\nThis box holds information that belongs to neither side, such as weather, terrain, supply or the state of the front line.\n\nThe text is deliberately long, so the wrapping and the height of the box can be checked. It should end close to the bottom edge."
