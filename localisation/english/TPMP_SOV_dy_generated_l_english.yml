 TPMP_SOV_dy_preset_mixed_by:0 "§gPlaceholder (Claude)§!"
 TPMP_SOV_dy_preset_mixed_name:0 "A 1936 army"
 TPMP_SOV_dy_preset_mixed_tt:0 "§YA 1936 army§! (Placeholder (Claude))\n30%  Line infantry equipment\n20%  Light tanks (1936 chassis)\n15%  Artillery\n15%  Small airframe (fighters, CAS)\n10%  Trucks\n5%  Support equipment\n5%  Anti-tank guns\n\n§YClick§! to replace your order with this one."
 TPMP_SOV_dy_preset_oldpile_by:0 "§gDefault: light tanks only§!"
 TPMP_SOV_dy_preset_oldpile_name:0 "The old pile"
 TPMP_SOV_dy_preset_oldpile_tt:0 "§YThe old pile§! (Default: light tanks only)\n100%  Light tanks (1936 chassis)\n\n§YClick§! to replace your order with this one."
 TPMP_SOV_dy_presets_head:0 "SUGGESTED ORDERS"
 TPMP_SOV_dy_presets_note:0 "Orders from players who have one in mind. Click one to replace your order with it."
 TPMP_SOV_dy_row_aa_name:0 "Anti-air guns"
 TPMP_SOV_dy_row_aa_tt:0 "§YAnti-air guns§!\n$anti_air_equipment_1$: §Y6.8 IC§! a unit (type cost), §Y13,926§! units for 100% of the budget.\nGreat War anti-air guns: §Y6 IC§! a unit (type cost), §Y15,667§! units for 100% of the budget.\nDelivers the newest of these you have researched by then.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_art_name:0 "Artillery"
 TPMP_SOV_dy_row_art_tt:0 "§YArtillery§!\n$artillery_equipment_1$: §Y9 IC§! a unit (type cost), §Y10,444§! units for 100% of the budget.\nGreat War artillery: §Y8 IC§! a unit (type cost), §Y11,750§! units for 100% of the budget.\nDelivers the newest of these you have researched by then.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_at_name:0 "Anti-tank guns"
 TPMP_SOV_dy_row_at_tt:0 "§YAnti-tank guns§!\n$anti_tank_equipment_1$: §Y6.8 IC§! a unit (type cost), §Y13,926§! units for 100% of the budget.\nGreat War anti-tank guns: §Y6 IC§! a unit (type cost), §Y15,667§! units for 100% of the budget.\nDelivers the newest of these you have researched by then.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_ht36_name:0 "Heavy tanks (1936 chassis)"
 TPMP_SOV_dy_row_ht36_tt:0 "§YHeavy tanks (1936 chassis)§!\n$heavy_tank_chassis_1936$: §Y37.4 IC§! a unit (dearest Soviet starting design (T-35)), §Y2,513§! units for 100% of the budget.\nSends your §Yup-to-date§! design on this type (alphabetically first if several).\n§YSoviet starting designs still up to date:§! T-35, KV-1. Mark them obsolete if you do not want them sent.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_li_name:0 "Line infantry equipment"
 TPMP_SOV_dy_row_li_tt:0 "§YLine infantry equipment§!\n$line_infantry_equipment_1$: §Y0.8 IC§! a unit (dearest Soviet starting design (Inf Eq.)), §Y122,635§! units for 100% of the budget.\nSends your §Yup-to-date§! design on this type (alphabetically first if several).\n§YSoviet starting designs still up to date:§! Inf Eq.. Mark them obsolete if you do not want them sent.\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_lp1_name:0 "Large airframe (strategic bombers)"
 TPMP_SOV_dy_row_lp1_tt:0 "§YLarge airframe (strategic bombers)§!\n$large_plane_airframe_1$: §Y190.5 IC§! a unit (dearest Soviet starting design (Pe-8)), §Y493§! units for 100% of the budget.\nSends your §Yup-to-date§! design on this type (alphabetically first if several).\n§YSoviet starting designs still up to date:§! Pe-8. Mark them obsolete if you do not want them sent.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_lt36_name:0 "Light tanks (1936 chassis)"
 TPMP_SOV_dy_row_lt36_tt:0 "§YLight tanks (1936 chassis)§!\n$light_tank_chassis_1936$: §Y12.6 IC§! a unit (dearest Soviet starting design (T-26TU mod. 1933)), §Y7,460§! units for 100% of the budget.\nSends your §Yup-to-date§! design on this type (alphabetically first if several).\n§YSoviet starting designs still up to date:§! T-26TU mod. 1933, BT-5. Mark them obsolete if you do not want them sent.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_lt38_name:0 "Light tanks (1938 chassis)"
 TPMP_SOV_dy_row_lt38_tt:0 "§YLight tanks (1938 chassis)§!\n$light_tank_chassis_1938$: §Y14.5 IC§! a unit (dearest Soviet starting design (BT-7)), §Y6,483§! units for 100% of the budget.\nSends your §Yup-to-date§! design on this type (alphabetically first if several).\n§YSoviet starting designs still up to date:§! BT-7. Mark them obsolete if you do not want them sent.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_mi_name:0 "Mobile infantry equipment"
 TPMP_SOV_dy_row_mi_tt:0 "§YMobile infantry equipment§!\n$mobile_infantry_equipment_1$: §Y0.8 IC§! a unit (dearest Soviet starting design (Mobile Eq.)), §Y122,635§! units for 100% of the budget.\nSends your §Yup-to-date§! design on this type (alphabetically first if several).\n§YSoviet starting designs still up to date:§! Mobile Eq.. Mark them obsolete if you do not want them sent.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_mot_name:0 "Trucks"
 TPMP_SOV_dy_row_mot_tt:0 "§YTrucks§!\n$motorized_equipment_1$: §Y4 IC§! a unit (type cost), §Y23,500§! units for 100% of the budget.\n$motorized_equipment_0$: §Y4 IC§! a unit (type cost), §Y23,500§! units for 100% of the budget.\nDelivers the newest of these you have researched by then.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_mp1_name:0 "Medium airframe (tactical bombers)"
 TPMP_SOV_dy_row_mp1_tt:0 "§YMedium airframe (tactical bombers)§!\n$medium_plane_airframe_1$: §Y79.5 IC§! a unit (dearest Soviet starting design (ANT-40)), §Y1,182§! units for 100% of the budget.\nSends your §Yup-to-date§! design on this type (alphabetically first if several).\n§YSoviet starting designs still up to date:§! ANT-40. Mark them obsolete if you do not want them sent.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_mt36_name:0 "Medium tanks (1936 chassis)"
 TPMP_SOV_dy_row_mt36_tt:0 "§YMedium tanks (1936 chassis)§!\n$medium_tank_chassis_1936$: §Y25.5 IC§! a unit (dearest Soviet starting design (T-28)), §Y3,686§! units for 100% of the budget.\nSends your §Yup-to-date§! design on this type (alphabetically first if several).\n§YSoviet starting designs still up to date:§! T-28, A-20. Mark them obsolete if you do not want them sent.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_mt38_name:0 "Medium tanks (1938 chassis)"
 TPMP_SOV_dy_row_mt38_tt:0 "§YMedium tanks (1938 chassis)§!\n$medium_tank_chassis_1938$: §Y29 IC§! a unit (chassis cost x 2.42 (the lt38 line's design/chassis ratio)), §Y3,241§! units for 100% of the budget.\nSends your §Yup-to-date§! design on this type (alphabetically first if several).\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_si_name:0 "Special forces equipment"
 TPMP_SOV_dy_row_si_tt:0 "§YSpecial forces equipment§!\n$special_infantry_equipment_1$: §Y0.8 IC§! a unit (dearest Soviet starting design (SF Eq.)), §Y122,635§! units for 100% of the budget.\nSends your §Yup-to-date§! design on this type (alphabetically first if several).\n§YSoviet starting designs still up to date:§! SF Eq.. Mark them obsolete if you do not want them sent.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_sp1_name:0 "Small airframe (fighters, CAS)"
 TPMP_SOV_dy_row_sp1_tt:0 "§YSmall airframe (fighters, CAS)§!\n$small_plane_airframe_1$: §Y39 IC§! a unit (dearest Soviet starting design (I-16 Type 10)), §Y2,410§! units for 100% of the budget.\nSends your §Yup-to-date§! design on this type (alphabetically first if several).\n§YSoviet starting designs still up to date:§! I-16, I-16 Type 10. Mark them obsolete if you do not want them sent.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_row_sup_name:0 "Support equipment"
 TPMP_SOV_dy_row_sup_tt:0 "§YSupport equipment§!\n$support_equipment_1$: §Y4 IC§! a unit (type cost), §Y23,500§! units for 100% of the budget.\n§gNot researched, or no up-to-date design, at delivery: becomes line infantry equipment of the same value.§!\n\n§YClick§! the slider to put the knob there; the arrows move §Y1%§! (§YShift§! 10%, §YCtrl§! all the way)."
 TPMP_SOV_dy_rules:0 "Each line sends your §Yup-to-date§! design of that type. If several are up to date, the §Yfirst in alphabetical order§! is sent: keep one up to date and mark the rest obsolete in the designer.\n\nCounts are fixed: a dearer design gets the same number of units.\n\nA line that is §Ynot researched§! or has §Yno up-to-date design§! at delivery becomes §Yline infantry equipment§! of the same value."
