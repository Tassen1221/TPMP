#Events

UKR_Stalin_quotas_event.1.t: "Stalin is disappointed in you"
UKR_Stalin_quotas_event.1.d: "Stalin considers all soviet people as his children. You are still one of them, unfortunately the one who disappointed him the most."
UKR_Stalin_quotas_event.1.a: "I am sorry, Papa Stalin."

UKR_Stalin_quotas_event.2.t: "Stalin's Pride"
UKR_Stalin_quotas_event.2.d: "Stalin's demanding quotas were met. Many men and women of Ukraine worked hard to accomplish this task. New resource mines will aid the upcomming industrial development."
UKR_Stalin_quotas_event.2.a: "Forward into the future."

UKR_Stalin_quotas_event.3.t: "Stalin's Astonishment"
UKR_Stalin_quotas_event.3.d: "Never in the history of USSR development has been so rapid. Stalin is comming to personally congratulate you. Prades will be held. This achievement will be celebrated by whole nation."
UKR_Stalin_quotas_event.3.a: "Bright future lies ahead!"

UKR_Stalin_quotas_event.4.t: "Stalin is disappointed in you"
UKR_Stalin_quotas_event.4.d: "Stalin considers all soviet people as his children. You are still one of them, unfortunately the one who disappointed him the most."
UKR_Stalin_quotas_event.4.a: "I am sorry, Papa Stalin."

UKR_Stalin_quotas_event.5.t: "Stalin's Pride"
UKR_Stalin_quotas_event.5.d: "Stalin's demanding quotas were met. Many men and women of Ukraine worked hard to accomplish this task. Newly produced equipment will aid the Red Army."
UKR_Stalin_quotas_event.5.a: "Militarization is going as expected."

UKR_Stalin_quotas_event.6.t: "Stalin's Astonishment"
UKR_Stalin_quotas_event.6.d: "Never in the history of USSR development has been so rapid. Stalin is comming to personally congratulate you. People have never been motivated so much to work together towards increasing military strength of the nation."
UKR_Stalin_quotas_event.6.a: "Future belongs to us!"

UKR_great_purge_event.1.t: "Stalin's Directives"
UKR_great_purge_event.1.d: "It has been recently discovered that Stanislav Kosior has been plotting against Soviet Union. We will send the replacement promptly. In the meantime he should be dealt with. \n\n Iosif Stalin"
UKR_great_purge_event.1.a: "We'll deal with it swiftly."

UKR_negotiations_with_stalin_event.1.t: "Second Five Year Plan"
UKR_negotiations_with_stalin_event.1.d: "With completion of First Five Year Plan, we need to carefully consider how we will aproach the Second Five Year Plan. We need to set realistic standards for our development."
UKR_negotiations_with_stalin_event.1.a: "Every man and woman of Ukraine will work towards the common goal!"
UKR_negotiations_with_stalin_event.1.b: "Let us keep quotas realistic..."

UKR_five_year_plan.1.t: "First Five Year Plan's Success"
UKR_five_year_plan.1.d: "Stalin himself must be proud of us. We showed everybody Ukrainian work ethic and greatness of our people. And we will do better next time."
UKR_five_year_plan.1.a: "We have succeeded and we will do it once more!"

UKR_five_year_plan.2.t: "First Five Year Plan's Failure"
UKR_five_year_plan.2.d: "Those requirements couldn't be met. No ammount of overtime work would fix this planning mistake."
UKR_five_year_plan.2.a: "How did we fail?"

UKR_five_year_plan.3.t: "Second Five Year Plan's Success"
UKR_five_year_plan.3.d: "The Soviet People's resolve is unmatched. No task ahead is impossible."
UKR_five_year_plan.3.a: "Another great acomplishment!"

UKR_five_year_plan.4.t: "Second Five Year Plan's Failure"
UKR_five_year_plan.4.d: "The quotas couldn't have been matched. We overrestimated ourselves and sentenced to inhuman effort to make it up."
UKR_five_year_plan.4.a: "Despite all this... Yet again, we have failed"