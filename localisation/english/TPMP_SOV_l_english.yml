TPMP_SOV_ordnance_designers_category_desc: "                          Vasily Degtyarev Clout: [?TPMP_SOV_clout_degtyarev_var]   Georgy Shpagin Clout: [?TPMP_SOV_clout_shpagin_var]                            Sergei Simonov Clout: [?TPMP_SOV_clout_simonov_var]    Fyodor Tokarev Clout: [?TPMP_SOV_clout_tokarev_var]"

#### Skeleton v1 (2026-11-07): politics + 3rd FYP placeholders
TPMP_SOV_vigilance_after_kirov: "Vigilance After Kirov"
TPMP_SOV_vigilance_after_kirov_desc: "Kirov's murder in December 1934 gave the Party its excuse: enemies hide everywhere. Stalin's old guard and his new men eye each other. Out with the old, in with the young."
TPMP_SOV_vigilance_after_kirov_tt: "§YPlaceholder (skeleton v1).§! Planned: opens the political branch and the purge rounds."
TPMP_SOV_order_00447: "Order No. 00447"
TPMP_SOV_order_00447_desc: "July 1937: the NKVD hands every region a quota of arrests. A five-year plan for the camps."
TPMP_SOV_order_00447_tt: "§YPlaceholder (skeleton v1).§! Planned: arrest quotas feed the gulag; opens the gulag and NKVD focuses."
TPMP_SOV_wreckers_trial: "The Wreckers' Trial"
TPMP_SOV_wreckers_trial_desc: "January 1937: Pyatakov and the industrial old guard in the dock. The plant directors who built the first plans are now suspects."
TPMP_SOV_wreckers_trial_tt: "§YPlaceholder (skeleton v1).§! Planned: §Yoptional§! purge round, industry. An event chain lists the old guard of industry: spare a man and keep his debuff, or purge him, take him off the wall and gain a small reward. A young promotee takes the seat."
TPMP_SOV_military_conspiracy: "The Military Conspiracy"
TPMP_SOV_military_conspiracy_desc: "June 1937: Tukhachevsky and the high command are shot. The Civil War generation of the Red Army is swept away."
TPMP_SOV_military_conspiracy_tt: "§YPlaceholder (skeleton v1).§! Planned: §Rmandatory§! purge round, army. Same event-chain choice over the old generals; young officers rise in their place."
TPMP_SOV_bloc_of_rights: "The Bloc of Rights and Trotskyites"
TPMP_SOV_bloc_of_rights_desc: "March 1938: Bukharin, Rykov and Yagoda. The last old Bolsheviks of the court go on trial."
TPMP_SOV_bloc_of_rights_tt: "§YPlaceholder (skeleton v1).§! Planned: §Yoptional§! purge round, court. Settle the post-purge cabinet."
TPMP_SOV_nkvd_border_troops: "NKVD Border Troops"
TPMP_SOV_nkvd_border_troops_desc: "The NKVD guards the frontiers with its own divisions."
TPMP_SOV_nkvd_border_troops_tt: "§YPlaceholder (skeleton v1).§! Planned: NKVD flavour; unlocks the NKVD border division template now."
TPMP_SOV_nkvd_special_departments: "The Special Departments"
TPMP_SOV_nkvd_special_departments_desc: "NKVD officers inside every army unit, watching the commanders."
TPMP_SOV_nkvd_special_departments_tt: "§YPlaceholder (skeleton v1).§! Planned: NKVD flavour, to be designed."
TPMP_SOV_beria_replaces_yezhov: "Beria Replaces Yezhov"
TPMP_SOV_beria_replaces_yezhov_desc: "Late 1938: the machine starts eating its own. Yezhov falls, Beria takes the NKVD and the scripted Terror ends."
TPMP_SOV_beria_replaces_yezhov_tt: "§YPlaceholder (skeleton v1).§! Planned: ends the scripted purge rounds. Afterwards purges continue only on your own initiative (arrests on the wall, camp labour). Available from mid-1938."
TPMP_SOV_release_the_useful_ones: "Release the Useful Ones"
TPMP_SOV_release_the_useful_ones_desc: "1940: some prisoners are worth more at the front than in the camps. Rokossovsky walks out of prison."
TPMP_SOV_release_the_useful_ones_tt: "§YPlaceholder (skeleton v1).§! Planned: bring back a few purged officers and specialists."
TPMP_SOV_begin_the_third_fyp: "Begin the Third Five-Year Plan"
TPMP_SOV_begin_the_third_fyp_desc: "The civilian economy is built. Now it must make weapons, before the war comes."
TPMP_SOV_vannikovs_nkv: "Vannikov's Armaments Commissariat"
TPMP_SOV_vannikovs_nkv_desc: "Boris Vannikov runs the guns. Every new weapon is a fight between his designers and Kulik's GAU."
TPMP_SOV_expand_tula_arms_plant: "Expand the Tula Arms Plant"
TPMP_SOV_expand_tula_arms_plant_desc: "The old imperial arsenal, home of Tokarev. Skeleton v1: the rifle contest (Simonov against Tokarev against the Mosin) will be an event chain here."
TPMP_SOV_gorky_plant_no_92: "Gorky Plant No. 92"
TPMP_SOV_gorky_plant_no_92_desc: "Grabin's artillery plant. Skeleton v1: the divisional gun contest and Grabin's illegal ZiS-3 will be an event chain here."
TPMP_SOV_expand_kovrov_plant_no_2: "Expand Kovrov Plant No. 2"
TPMP_SOV_expand_kovrov_plant_no_2_desc: "Degtyarev and Shpagin's plant. Skeleton v1: the submachine gun and machine gun contests will be event chains here."
TPMP_SOV_malyshevs_nktp: "Malyshev's Tank Commissariat"
TPMP_SOV_malyshevs_nktp_desc: "Vyacheslav Malyshev runs the tank plants: the T-34 and the KV."
TPMP_SOV_support_khpz: "Support the Kharkov Locomotive Plant"
TPMP_SOV_support_khpz_desc: "Plant No. 183 in Kharkov, birthplace of the T-34."
TPMP_SOV_support_kirov: "Support the Kirov Plant"
TPMP_SOV_support_kirov_desc: "Leningrad's Kirov plant builds the KV heavy tank."
TPMP_SOV_dedicated_diesel_engine_facility: "A Dedicated Diesel Engine Facility"
TPMP_SOV_dedicated_diesel_engine_facility_desc: "The V-2 diesel: the heart of the new tanks."

# skeleton v2: 3rd FYP expansion


# skeleton v3: 3rd FYP effects, foreign affairs, Ukrainian cooperation (generated)
TPMP_SOV_3fyp_shock_tt: "§RArms a shock:§! within a year a production accident may strike (30 days). It can be headed off with a §YMitigate Shocks§! decision."
TPMP_SOV_mon_slot_tt_aviation: "Gives §Yfull access§! to the §YAviation industry§! seat on the wall."
TPMP_SOV_mon_slot_tt_ships: "Gives §Yfull access§! to the §YShipbuilding§! seat on the wall."
TPMP_SOV_mon_slot_tt_ammo: "Gives §Yfull access§! to the §YAmmunition§! seat on the wall."
TPMP_SOV_mon_open_tt: "Opens the §Ymilitary seats§! on the wall (armaments, tanks, aviation, ammunition, shipbuilding, customers)."
TPMP_SOV_plant_arms_dm: "Third Five-Year Plan Plant"
TPMP_SOV_plant_yard_dm: "Third Five-Year Plan Yard"
TPMP_SOV_aviation_commissariat: "The Aviation Commissariat"
TPMP_SOV_aviation_commissariat_desc: "January 1939: aviation leaves the defence industry and gets a commissariat of its own, and a crowd of rival heads.\n\n§YOpens the aviation seat on the wall§! and speeds up air research."
TPMP_SOV_moscow_aircraft_plants_tt: "§YPlant:§! once §YMoscow§! has at least §Y16§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_moscow_aircraft_plants: "Moscow Aircraft Plants"
TPMP_SOV_moscow_aircraft_plants_desc: "Fili and Plant No. 1: the heart of Soviet aviation, deep in the West.\n\n§YPlant:§! faster military factory construction in §YMoscow§! for two years; fighter research once it reaches capacity."
TPMP_SOV_kharkov_voronezh_aircraft_plants_tt: "§YPlant:§! once §YVoronezh§! has at least §Y4§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_kharkov_voronezh_aircraft_plants: "Kharkov and Voronezh Plants"
TPMP_SOV_kharkov_voronezh_aircraft_plants_desc: "New aircraft plants in Ukraine and on the Don.\n\n§YPlant:§! faster military factory construction in §YKharkov§! and §YVoronezh§!; bomber research once Voronezh reaches capacity."
TPMP_SOV_new_fighter_contest: "The New Fighter Contest"
TPMP_SOV_new_fighter_contest_desc: "1939-40: Yakovlev, Mikoyan-Gurevich and Lavochkin race to replace the I-16. Three winners, no favourite.\n\n§YTwo fighter research bonuses§!."
TPMP_SOV_kazan_plant_124_tt: "§YPlant:§! once §YKazan§! has at least §Y5§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_kazan_plant_124: "Kazan Plant No. 124"
TPMP_SOV_kazan_plant_124_desc: "The great new plant on the Volga, built for the four-engined TB-7.\n\n§YPlant:§! faster military factory construction in §YKazan§!; strategic bomber research once it reaches capacity."
TPMP_SOV_delta_wood_airframes: "Delta-Wood Airframes"
TPMP_SOV_delta_wood_airframes_desc: "Resin-soaked birch instead of aluminium: Lavochkin's fighters are heavy, but they can be built anywhere.\n\n§YCheaper§! small airframes, §Rless reliable and agile§!."
TPMP_SOV_duralumin_airframes: "Duralumin Airframes"
TPMP_SOV_duralumin_airframes_desc: "Metal airframes like the West's, if the aluminium plants keep up.\n\n§YMore reliable and agile§! small airframes, §Ra little dearer§!."
TPMP_SOV_petlyakov_sharashka: "TsKB-29: The Prison Bureau"
TPMP_SOV_petlyakov_sharashka_desc: "Tupolev and Petlyakov design bombers behind NKVD wire. The Pe-2 is born in a cell.\n\n§YTactical bomber and close air support research§!."
TPMP_SOV_aero_engine_plants_tt: "§YPlant:§! once §YYaroslavl§! has at least §Y4§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_aero_engine_plants: "The Aero-Engine Plants"
TPMP_SOV_aero_engine_plants_desc: "Rybinsk and Perm: no engines, no air force.\n\n§YPlant:§! faster military factory construction in §YYaroslavl§! and §YPerm§!; engine research once Yaroslavl reaches capacity."
TPMP_SOV_big_fleet_programme: "The Big Fleet Programme"
TPMP_SOV_big_fleet_programme_desc: "Stalin wants an ocean-going fleet, and the shipbuilding commissariat gets its heads on the wall.\n\n§YOpens the shipbuilding seat§! and speeds up naval research."
TPMP_SOV_nikolaev_leningrad_yards_tt: "§YPlant:§! once §YLeningrad§! has at least §Y7§! dockyards (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_nikolaev_leningrad_yards: "Nikolaev and Leningrad Yards"
TPMP_SOV_nikolaev_leningrad_yards_desc: "The Black Sea and Baltic yards lay down the big ships.\n\n§YYard:§! faster dockyard construction in §YLeningrad§! and §YMykolaiv§!; naval research once Leningrad reaches capacity."
TPMP_SOV_sovetsky_soyuz_battleships: "Lay Down the Sovetsky Soyuz"
TPMP_SOV_sovetsky_soyuz_battleships_desc: "Stalin wants the biggest battleships in the world, and four of them.\n\n§YMore dockyard output§!, §Ycheaper heavy hulls§! and §Ybattleship research§!."
TPMP_SOV_mosquito_fleet: "The Mosquito Fleet"
TPMP_SOV_mosquito_fleet_desc: "Forget the battleships: submarines, destroyers and torpedo boats for the coasts.\n\n§YCheaper submarine and light hulls§! and §Ysubmarine and destroyer research§!."
TPMP_SOV_tula_cartridge_works_tt: "§YPlant:§! once §YTula§! has at least §Y6§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_tula_cartridge_works: "Tula Cartridge Works"
TPMP_SOV_tula_cartridge_works_desc: "Shells and cartridges by the hundred million, and a commissariat of ammunition to count them.\n\n§YOpens the ammunition seat§!. §YPlant:§! faster military factory construction in §YTula§!; shell research once it reaches capacity."
TPMP_SOV_lugansk_cartridge_works_tt: "§YPlant:§! once §YVoroshilovgrad§! has at least §Y4§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_lugansk_cartridge_works: "Lugansk Cartridge Works"
TPMP_SOV_lugansk_cartridge_works_desc: "The Donbass cartridge plant, in the Ukrainian SSR's backyard.\n\n§YPlant:§! faster military factory construction in §YVoroshilovgrad§!; infantry equipment research once it reaches capacity. §RArms a shock§!."
TPMP_SOV_leningrad_shell_works_tt: "§YPlant:§! once §YLeningrad§! has at least §Y14§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_leningrad_shell_works: "Leningrad Shell Works"
TPMP_SOV_leningrad_shell_works_desc: "Leningrad's plants fill the shells for the whole northwest.\n\n§YPlant:§! faster military factory construction in §YLeningrad§!; artillery research once it reaches capacity."
TPMP_SOV_dzerzhinsk_powder_plants_tt: "§YPlant:§! once §YGorky§! has at least §Y7§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_dzerzhinsk_powder_plants: "The Dzerzhinsk Powder Plants"
TPMP_SOV_dzerzhinsk_powder_plants_desc: "No shell without powder: the chemical plants on the Oka.\n\n§YPlant:§! faster military factory construction in §YGorky§!; two shell research bonuses once it reaches capacity. §RArms a shock§!."
TPMP_SOV_shells_by_tonnage: "Shells by the Tonne"
TPMP_SOV_shells_by_tonnage_desc: "The plan counts tonnes, so the plants make tonnes.\n\n§YCheaper§! artillery, §Rweaker§! artillery."
TPMP_SOV_fuzes_and_precision: "Fuzes and Precision"
TPMP_SOV_fuzes_and_precision_desc: "Too many shells fired in Finland never went off. Fix the fuzes first.\n\n§YStronger§! artillery, §Ra little dearer§!, and a shell research bonus."
TPMP_SOV_mobilisation_ammunition_reserve: "The Mobilisation Reserve"
TPMP_SOV_mobilisation_ammunition_reserve_desc: "Fill the depots for the first months of war.\n\n§YA stockpile of artillery§! now."
TPMP_SOV_expand_tula_arms_plant_tt: "§YPlant:§! once §YTula§! has at least §Y8§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_gorky_plant_no_92_tt: "§YPlant:§! once §YGorky§! has at least §Y5§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_expand_kovrov_plant_no_2_tt: "§YPlant:§! once §YIvanovo§! has at least §Y4§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_izhevsk_plant_74_tt: "§YPlant:§! once §YUdmurtia§! has at least §Y4§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_izhevsk_plant_74: "Izhevsk Plant No. 74"
TPMP_SOV_izhevsk_plant_74_desc: "Rifles by the million from the Udmurt works.\n\n§YPlant:§! faster military factory construction in §YUdmurtia§!; two rifle research bonuses once it reaches capacity."
TPMP_SOV_grabins_divisional_gun: "Grabin's Divisional Gun"
TPMP_SOV_grabins_divisional_gun_desc: "Grabin builds a better field gun at Plant No. 92 without asking permission. Kulik is furious.\n\n§YTwo artillery research bonuses§!."
TPMP_SOV_svt_for_the_infantry: "A Self-Loader for Every Rifleman"
TPMP_SOV_svt_for_the_infantry_desc: "Tokarev's SVT-40 replaces the Mosin: modern, fragile, expensive.\n\n§YStronger§! infantry equipment, §Rdearer§!, and a rifle research bonus."
TPMP_SOV_mosin_and_ppsh: "Mosin and PPSh"
TPMP_SOV_mosin_and_ppsh_desc: "Keep the old rifle and stamp out submachine guns by the million. Kulik thinks SMGs are for policemen.\n\n§YCheaper§! infantry equipment and a close-combat research bonus."
TPMP_SOV_support_khpz_tt: "§YPlant:§! once §YKharkov§! has at least §Y11§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_support_kirov_tt: "§YPlant:§! once §YLeningrad§! has at least §Y13§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_gorky_light_tanks: "Light Tanks from GAZ"
TPMP_SOV_gorky_light_tanks_desc: "The Gorky car plant can bolt armour onto truck parts. Nobody asks whether it should.\n\n§YA pile of light tanks§! now (junk, but tanks) and a light chassis research bonus."
TPMP_SOV_t34_into_series: "The T-34 into Series"
TPMP_SOV_t34_into_series_desc: "Koshkin drives his prototypes to Moscow and back. Put it into production, faults and all.\n\n§YTwo medium chassis research bonuses§! and an armour bonus."
TPMP_SOV_the_kv_line: "The KV Line"
TPMP_SOV_the_kv_line_desc: "The Kirov plant's heavy tank shrugs off every gun in Finland. Build heavies first.\n\n§YTwo heavy chassis research bonuses§! and an armour bonus."
TPMP_SOV_stalingrad_tractor_tanks_tt: "§YPlant:§! once §YStalingrad§! has at least §Y7§! military factories (checked weekly), the plant reaches capacity and gives:"
TPMP_SOV_stalingrad_tractor_tanks: "Tanks from the Stalingrad Tractor Plant"
TPMP_SOV_stalingrad_tractor_tanks_desc: "The tractor plant on the Volga switches its lines to tanks.\n\n§YPlant:§! faster military factory construction in §YStalingrad§!; two armour research bonuses once it reaches capacity. §RArms a shock§!."
TPMP_SOV_mobilisation_plan: "Mobilisation Plan MP-41"
TPMP_SOV_mobilisation_plan_desc: "The last plan before the war: every plant gets its war orders in a sealed envelope.\n\n§YBetter factory efficiency§! from now on."
TPMP_SOV_delta_wood_idea: "Delta-Wood Airframes"
TPMP_SOV_delta_wood_idea_desc: "Birch and resin instead of aluminium: cheaper fighters, heavier and less reliable."
TPMP_SOV_duralumin_idea: "Duralumin Airframes"
TPMP_SOV_duralumin_idea_desc: "Proper metal airframes: better fighters at a higher price."
TPMP_SOV_big_ships_idea: "The Big Fleet"
TPMP_SOV_big_ships_idea_desc: "Four Sovetsky Soyuz battleships are on the slips."
TPMP_SOV_mosquito_fleet_idea: "The Mosquito Fleet"
TPMP_SOV_mosquito_fleet_idea_desc: "Submarines and torpedo boats, many and cheap."
TPMP_SOV_shells_by_tonnage_idea: "Shells by the Tonne"
TPMP_SOV_shells_by_tonnage_idea_desc: "The plan counts tonnes."
TPMP_SOV_fuzes_idea: "Fuzes and Precision"
TPMP_SOV_fuzes_idea_desc: "Fewer shells, and they go off."
TPMP_SOV_svt_idea: "A Self-Loader for Every Rifleman"
TPMP_SOV_svt_idea_desc: "The SVT-40 is modern, fragile and expensive."
TPMP_SOV_mosin_ppsh_idea: "Mosin and PPSh"
TPMP_SOV_mosin_ppsh_idea_desc: "The old rifle and a stamped steel submachine gun, by the million."
TPMP_SOV_mp41_idea: "Mobilisation Plan MP-41"
TPMP_SOV_mp41_idea_desc: "The whole industry has a war plan."
TPMP_SOV_ammo_shock_idea: "Ammunition Shock"
TPMP_SOV_ammo_shock_idea_desc: "Accident and arrests at the powder and cartridge plants."
TPMP_SOV_ukr_cooperation_1: "Fraternal Cooperation"
TPMP_SOV_ukr_cooperation_1_desc: "Kiev's planners share their figures with Gosplan."
TPMP_SOV_ukr_cooperation_3: "Fraternal Republics"
TPMP_SOV_ukr_cooperation_3_desc: "Two republics, one plan."
TPMP_SOV_plant.1.t: "Moscow Aircraft Plants at Capacity"
TPMP_SOV_plant.1.d: "Moscow now has the plant the plan asked for. The design bureaus move in beside the production lines: what is built here is now also improved here."
TPMP_SOV_plant.1.a: "Production first, research after."
TPMP_SOV_plant.2.t: "Kharkov and Voronezh Plants at Capacity"
TPMP_SOV_plant.2.d: "Voronezh now has the plant the plan asked for. The design bureaus move in beside the production lines: what is built here is now also improved here."
TPMP_SOV_plant.2.a: "Production first, research after."
TPMP_SOV_plant.3.t: "Kazan Plant No. 124 at Capacity"
TPMP_SOV_plant.3.d: "Kazan now has the plant the plan asked for. The design bureaus move in beside the production lines: what is built here is now also improved here."
