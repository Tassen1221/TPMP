TPMP_SOV_molotov_replaces_litvinov_desc: "May 1939: Litvinov and collective security are out, Molotov is in, and Berlin notices."
TPMP_SOV_non_aggression_pact_tt: "§YPlaceholder (skeleton v4).§! Planned: non-aggression pact with Germany; opens the borderland focuses."
TPMP_SOV_non_aggression_pact: "The Non-Aggression Pact"
TPMP_SOV_non_aggression_pact_desc: "August 1939: Ribbentrop flies to Moscow. The secret protocol splits Eastern Europe."
TPMP_SOV_partition_of_poland_tt: "§YPlaceholder (skeleton v4).§! Planned: claims on eastern Poland; take them as Poland falls."
TPMP_SOV_partition_of_poland: "The Line on the Map"
TPMP_SOV_partition_of_poland_desc: "September 1939: the Red Army marches to the line the protocol drew."
TPMP_SOV_german_trade_agreements_tt: "§YPlaceholder (skeleton v4).§! Planned: trade resources to Germany for industry and naval bonuses."
TPMP_SOV_german_trade_agreements: "The Trade Agreements"
TPMP_SOV_german_trade_agreements_desc: "Grain and oil go west; machine tools, samples and the unfinished cruiser Lützow come east."
TPMP_SOV_baltic_mutual_assistance_tt: "§YPlaceholder (skeleton v4).§! Planned: bases in Estonia, Latvia and Lithuania, then annexation."
TPMP_SOV_baltic_mutual_assistance: "Mutual Assistance in the Baltic"
TPMP_SOV_baltic_mutual_assistance_desc: "Autumn 1939: bases first; summer 1940: governments, then the Union."
TPMP_SOV_demands_on_finland_tt: "§YPlaceholder (skeleton v4).§! Planned: territorial demands on Finland; leads into the Winter War (outcome in the Red Army branch)."
TPMP_SOV_demands_on_finland: "Demands on Finland"
TPMP_SOV_demands_on_finland_desc: "Move the border back from Leningrad, lease Hanko. Helsinki says no."
TPMP_SOV_bessarabia_ultimatum_tt: "§YPlaceholder (skeleton v4).§! Planned: demand Bessarabia and northern Bukovina from Romania."
TPMP_SOV_bessarabia_ultimatum: "The Bessarabian Ultimatum"
TPMP_SOV_bessarabia_ultimatum_desc: "June 1940: Romania gets twenty-four hours."
TPMP_SOV_aid_to_china_tt: "§YPlaceholder (skeleton v4).§! Planned: equipment and air volunteers to China; air experience."
TPMP_SOV_aid_to_china: "Volunteers for China"
TPMP_SOV_aid_to_china_desc: "1937-41: pilots, advisers and aircraft for Chiang, to keep Japan busy."
TPMP_SOV_neutrality_pact_with_japan_tt: "§YPlaceholder (skeleton v4).§! Planned: neutrality pact with Japan; frees Far East divisions for the West."
TPMP_SOV_neutrality_pact_with_japan: "The Neutrality Pact with Japan"
TPMP_SOV_neutrality_pact_with_japan_desc: "April 1941: Stalin sees Matsuoka off at the station himself."
TPMP_SOV_buying_time_tt: "§YPlaceholder (skeleton v4).§! Planned: the last pre-war foreign focus; small war preparation bonus."
TPMP_SOV_buying_time: "Buying Time"
TPMP_SOV_buying_time_desc: "Every month without war is another month for the plants."
TPMP_SOV_ukrainian_question: "The Ukrainian Question"
TPMP_SOV_ukrainian_question_desc: "Kiev, Kharkov and the Donbass answer to their own government. Moscow must decide what it wants from them: more for the Union, or a stronger Ukraine at its side.\n\n§YFraternal Cooperation§!: a little more factory efficiency and research speed."
TPMP_SOV_ukr_grain_deliveries: "Grain from the Black Earth"
TPMP_SOV_ukr_grain_deliveries_desc: "Ukrainian grain trains roll north on Moscow's schedule, not Kiev's.\n\n§YTake from Ukraine§! (exclusive with §YArms for Kiev§!): §Ystability§!."
TPMP_SOV_ukr_donbass_coal_and_steel: "Donbass Coal and Steel"
TPMP_SOV_ukr_donbass_coal_and_steel_desc: "Delivery contracts for Donbass coal and Krivoy Rog steel, priced in Moscow.\n\n§YSteel and coal§! for the Union."
TPMP_SOV_ukr_moscows_line_in_kiev: "Moscow's Line in Kiev"
TPMP_SOV_ukr_moscows_line_in_kiev_desc: "Kiev's ministers learn to read Pravda before they write their own decrees.\n\n§Y+100 political power§! and §Ystability§! for you, §R-50 political power§! for Ukraine."
TPMP_SOV_ukr_volunteers: "Ukrainian Volunteers"
TPMP_SOV_ukr_volunteers_desc: "Young Ukrainians enlist in the Red Army, not their own.\n\n§YManpower§! for you."
TPMP_SOV_ukr_arms_for_kiev: "Arms for Kiev"
TPMP_SOV_ukr_arms_for_kiev_desc: "Soviet rifles and guns for a Ukrainian army that will stand on the Union's western flank.\n\n§YBuild up Ukraine§! (exclusive with §YGrain from the Black Earth§!): you send §Y1,500 infantry equipment§! and §Y150 artillery§!; Ukraine raises §Y3 rifle divisions§!."
TPMP_SOV_ukr_factories_for_kiev: "Factories for Kiev"
TPMP_SOV_ukr_factories_for_kiev_desc: "Union money and Union machine tools for Ukrainian plants.\n\n§YUkraine§! gains §Y4 military and 4 civilian factories§! in Kiev."
TPMP_SOV_ukr_black_sea_yards: "The Black Sea Yards"
TPMP_SOV_ukr_black_sea_yards_desc: "Mykolaiv's yards get Union orders and Union steel.\n\n§YUkraine§! gains §Y3 dockyards§! in Mykolaiv."
TPMP_SOV_ukr_dnieper_power: "Power from the Dnieper"
TPMP_SOV_ukr_dnieper_power_desc: "DniproHES current for the Kharkov plants.\n\n§YUkraine§! gains energy and industrial infrastructure in Kharkov."
TPMP_SOV_ukr_fraternal_republics: "Fraternal Republics"
TPMP_SOV_ukr_fraternal_republics_desc: "Two republics, one plan, whichever road got them here.\n\n§YFraternal Republics§!: efficiency, research, dockyard output and stability."
