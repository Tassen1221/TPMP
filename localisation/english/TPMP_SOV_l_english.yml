TPMP_shock3.lugansk.t: "Sabotage at the Cartridge Works"
TPMP_shock3.lugansk.d: "A batch of cartridges from Voroshilovgrad will not fire. The NKVD calls it wrecking; the engineers call it the plan."
TPMP_shock3.lugansk.a: "Find the wreckers."
TPMP_shock3.dzerzhinsk.t: "Explosion at Dzerzhinsk"
TPMP_shock3.dzerzhinsk.d: "A powder line at Dzerzhinsk has gone up. The quota for the quarter went with it."
TPMP_shock3.dzerzhinsk.a: "Rebuild and arrest someone."
TPMP_shock3.stalingrad.t: "The Tractor Plant Stalls"
TPMP_shock3.stalingrad.d: "Converting tractor lines to tanks has stopped both. Stalingrad reports zero tanks and zero tractors."
TPMP_shock3.stalingrad.a: "Get it moving."
TPMP_SOV_mitigate_lugansk_shock_decision: "Head Off: Sabotage at the Cartridge Works"
TPMP_SOV_mitigate_lugansk_shock_decision_desc: "Pay the managers, check the lines, arrest the right people early. Cancels the pending shock; §Rraises paranoia§!."
