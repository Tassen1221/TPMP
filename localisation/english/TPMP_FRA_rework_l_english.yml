l_english:
 TPMP_FRA_bread_peace_liberty:0 "Bread, Peace, Liberty"
 TPMP_FRA_bread_peace_liberty_desc:0 "The Republic must earn the sacrifice it asks of its citizens. Begin with a settlement that can survive the rearmament race."
 TPMP_FRA_matignon:0 "The Matignon Settlement"
 TPMP_FRA_matignon_desc:0 "Bring employers and organized labor to the same table. A negotiated armaments settlement buys dependable output and social confidence."
 TPMP_FRA_national_concentration:0 "A Cabinet of National Concentration"
 TPMP_FRA_national_concentration_desc:0 "A democratic conservative coalition places budget discipline and procurement continuity first. Parliament remains the source of authority."
 TPMP_FRA_republican_arsenal:0 "The Republican Arsenal"
 TPMP_FRA_republican_arsenal_desc:0 "The factories belong to a country worth defending. Turn the settlement into regular shifts, trained hands and reliable deliveries."
 TPMP_FRA_contracts_without_interruption:0 "Contracts Without Interruption"
 TPMP_FRA_contracts_without_interruption_desc:0 "Ministers may change; delivery schedules must not. Give the purchasing services authority to carry contracts across cabinet reshuffles."
 TPMP_FRA_daladier:0 "Daladier Takes Responsibility"
 TPMP_FRA_daladier_desc:0 "Concentrate executive responsibility without abandoning the Republic. The days of a government unable to authorize its own defense must end."
 TPMP_FRA_dautry:0 "Dautry at the Armaments Ministry"
 TPMP_FRA_dautry_desc:0 "A contract is useful when the arsenal can fulfill it. Put workshops, subcontractors and inspection schedules under one practical direction."
 TPMP_FRA_reynaud_tt:0 "Modify §YThe French Army§! by:\nDivision Recovery Rate: §G+4%§!"
 TPMP_FRA_reynaud:0 "Reynaud's War Cabinet"
 TPMP_FRA_reynaud_desc:0 "Give the cabinet a clear purpose: keep the army fighting and keep France in the war. Its authority will be tested by defeat as well as battle."
 TPMP_FRA_nation_under_arms:0 "A Nation Under Arms"
 TPMP_FRA_nation_under_arms_desc:0 "Call the trained reserve and reconcile military requirements with essential industrial work. Mobilization must produce formations, not merely names on a roll."
 TPMP_FRA_republic_will_fight_tt:0 "Modify §YThe French Army§! by:\nDivision Defense: §G+4%§!\nReinforce Rate: §G+1%§!\nStability: §G+4%§!\nArmy XP: §G+20§!"
 TPMP_FRA_republic_will_fight:0 "The Republic Will Fight"
 TPMP_FRA_republic_will_fight_desc:0 "No settlement can promise that France will hold forever. It can promise Germany a costly campaign and prepare people who will continue it."
 TPMP_FRA_fourteen_billion:0 "The Fourteen-Billion Programme"
 TPMP_FRA_fourteen_billion_desc:0 "Vote the money, then turn it into tools, trained hands and equipment before the strategic clock expires."
 TPMP_FRA_arsenal_contracts:0 "Drawings into Rifles"
 TPMP_FRA_arsenal_contracts_desc:0 "A rifle drawing is a promise. Saint-Étienne must turn it into gauges, jigs and an accepted pattern before the mobilization lists mean anything."
 TPMP_FRA_skilled_trades:0 "Expand the Skilled Trades"
 TPMP_FRA_skilled_trades_desc:0 "The bottleneck is often the person at the machine. Expand apprenticeships and inspection skills before adding another paper order."
 TPMP_FRA_nationalize_aircraft:0 "The National Aircraft Companies"
 TPMP_FRA_nationalize_aircraft_desc:0 "Consolidate fragmented airframe production around common tooling and workable series. The air ministry must receive complete aircraft rather than promises."
 TPMP_FRA_deliveries_arrive:0 "The Inspectors Sign the Series"
 TPMP_FRA_deliveries_arrive_desc:0 "The rejected components have filled enough railway wagons. Give the acceptance service a common standard, then let the arsenals commit their benches to a series."
 TPMP_FRA_machine_tools:0 "Machine Tools Before Promises"
 TPMP_FRA_machine_tools_desc:0 "Tool the subcontractors as well as the principal works. Common gauges and spare capacity make changing production less destructive."
 TPMP_FRA_dispersed_workshops:0 "Disperse the Workshops"
 TPMP_FRA_dispersed_workshops_desc:0 "Prepare smaller repair and finishing shops away from the largest industrial concentrations. Their value is the ability to keep working under pressure."
 TPMP_FRA_second_shifts:0 "The Second Shift"
 TPMP_FRA_second_shifts_desc:0 "Experienced foremen and planned shifts yield immediate output without pretending that every worker can be replaced overnight."
 TPMP_FRA_road_rail:0 "The Mobilization Timetables"
 TPMP_FRA_road_rail_desc:0 "A division cannot assemble at the station after its train has left. Reconcile the civilian railway timetable with the depots, reservist districts and army supply plan."
 TPMP_FRA_overseas_workshop_plans_continuity_tt:0 "Overseas workshop preparation: +1 additional offsite military factory when Brazzaville workshops are organized."
 TPMP_FRA_overseas_workshop_plans:0 "Plans for the Overseas Workshops"
 TPMP_FRA_overseas_workshop_plans_desc:0 "Send technical drawings, gauges and instructors to the overseas services. This prepares practical continuity without moving occupied factories by magic."
 TPMP_FRA_standardize_ammunition:0 "Standardize the Ammunition Trains"
 TPMP_FRA_standardize_ammunition_desc:0 "The right shell must reach the right battery. Reduce incompatible stocks and reserve trains for ammunition traffic."
 TPMP_FRA_rearmament_in_full:0 "Rearmament in Full Stride"
 TPMP_FRA_rearmament_in_full_desc:0 "Put the programme on a war footing. The Republic's accumulated investment must be felt in the campaign that is coming."
 TPMP_FRA_army_review_tt:0 "Modify §YThe French Army§! by:\nDivision Organization: §G+3%§!\nArmy XP: §G+25§!"
 TPMP_FRA_army_review:0 "The Army We Actually Have"
 TPMP_FRA_army_review_desc:0 "Begin with the formations, vehicles and reservists France possesses. Institutional reform must improve their ability to fight together."
 TPMP_FRA_methodical_battle_tt:0 "Modify §YThe French Army§! by:\nMaximum Planning: §G+10%§!\nMaximum Entrenchment: §G+2§!\nDivision Speed: §R-2%§!"
 TPMP_FRA_methodical_battle:0 "The Battle Has a Method"
 TPMP_FRA_methodical_battle_desc:0 "The observers find the targets, the batteries prepare the ground, the infantry moves and the reserve secures the gain. Make the sequence familiar enough to survive the noise of battle."
 TPMP_FRA_general_reserve_tt:0 "Modify §YThe French Army§! by:\nPlanning Speed: §G+15%§!\nReinforce Rate: §G+2%§!\nDivision Speed: §G+3%§!"
 TPMP_FRA_general_reserve:0 "Keep a Fist Behind the Front"
 TPMP_FRA_general_reserve_desc:0 "Every formation already has a place on the map. Keep one force whose destination remains undecided, and practice giving it orders when the enemy chooses where the battle will be."
 TPMP_FRA_interlocking_fires_tt:0 "Modify §YThe French Army§! by:\nDivision Defense: §G+5%§!\nEntrenchment Speed: §G+15%§!"
 TPMP_FRA_interlocking_fires:0 "Every Approach under Observation"
 TPMP_FRA_interlocking_fires_desc:0 "Give neighboring batteries a shared picture of the ground. The infantry must know who will answer its call when the enemy reaches the wire."
 TPMP_FRA_counterstroke_exercises_tt:0 "Modify §YThe French Army§! by:\nArmor Attack: §G+5%§!\nDivision Recovery Rate: §G+5%§!"
 TPMP_FRA_counterstroke_exercises:0 "Exercise the Counterstroke"
 TPMP_FRA_counterstroke_exercises_desc:0 "Practice the movement before the emergency. The reserve must arrive as a coherent force with fuel, orders and infantry support."
 TPMP_FRA_orders_in_time_tt:0 "Modify §YThe French Army§! by:\nDivision Organization: §G+4%§!\nPlanning Speed: §G+10%§!"
 TPMP_FRA_orders_in_time:0 "The Order Must Reach the Battalion"
 TPMP_FRA_orders_in_time_desc:0 "The staff has a plan. The battalion has a field telephone that may already be cut. Build rehearsed alternatives into the order before the first messenger leaves."
 TPMP_FRA_cavalry_mechanical_tt:0 "Modify §YThe French Army§! by:\nArmor Speed: §G+6%§!\nDivision Recovery Rate: §G+3%§!"
 TPMP_FRA_cavalry_mechanical:0 "The DLM: Find, Fix, Exploit"
 TPMP_FRA_cavalry_mechanical_desc:0 "The cavalry asks what lies beyond the next road junction. Give its mechanized formations reconnaissance, speed and the freedom to turn information into movement."
 TPMP_FRA_breakthrough_arm_tt:0 "Modify §YThe French Army§! by:\nArmor Attack: §G+7%§!\nArmor Defense: §G+4%§!"
 TPMP_FRA_breakthrough_arm:0 "The DCR: Break the Position"
 TPMP_FRA_breakthrough_arm_desc:0 "The infantry asks who will break the position in front of it. Concentrate armor with the engineers and supporting formations needed to force an opening."
 TPMP_FRA_together_in_battle_tt:0 "Modify §YThe French Army§! by:\nSupply Use: §G-4%§!\nDivision Organization: §G+3%§!\nArmy XP: §G+35§!\nRemoves §Y$FRA_victors_of_wwi$§!."
 TPMP_FRA_together_in_battle:0 "A Force That Fights Together"
 TPMP_FRA_together_in_battle_desc:0 "Resolve the service argument through common exercises. The armored formation must be able to recover, refuel and cooperate after its first attack."
 TPMP_FRA_reserve_training_tt:0 "Modify §YThe French Army§! by:\nArmy Training Time: §G-8%§!\nDivision Experience Gain: §G+8%§!\nManpower: §G+20000§!\nArmy XP: §G+20§!"
 TPMP_FRA_reserve_training:0 "Train the Reservists"
 TPMP_FRA_reserve_training_desc:0 "Make the second echelon usable before mobilization. Refresher training and competent junior leaders turn a roster into a fighting reserve."
 TPMP_FRA_anti_tank_depth_tt:0 "Modify §YThe French Army§! by:\nDivision Defense: §G+3%§!"
 TPMP_FRA_anti_tank_depth:0 "A Second Position for Every Gun"
 TPMP_FRA_anti_tank_depth_desc:0 "The first firing position will eventually be found. Prepare the second and rehearse moving the battery before its escape road disappears."
 TPMP_FRA_campaign_prepared_tt:0 "Modify §YThe French Army§! by:\nDivision Recovery Rate: §G+4%§!\nReinforce Rate: §G+1%§!\nWar Support: §G+6%§!\nArmy XP: §G+25§!"
 TPMP_FRA_campaign_prepared:0 "Ready for the Opening Campaign"
 TPMP_FRA_campaign_prepared_desc:0 "The army is ready to make Germany pay. Its cohesion can sustain a fierce defense; it cannot remove the campaign's approaching strategic collapse."
 TPMP_FRA_plan_v_tt:0 "Modify §YThe French Air Service§! by:\nAir Training XP Gain: §G+10%§!\nAir XP: §G+25§!"
 TPMP_FRA_plan_v:0 "Plan V"
 TPMP_FRA_plan_v_desc:0 "The air programme needs complete combat units: airframes, ground crews, dispersal fields and a supply service."
 TPMP_FRA_ground_crews_tt:0 "Modify §YThe French Air Service§! by:\nAir Accident Risk: §G-10%§!\nAir Mission Efficiency: §G+3%§!"
 TPMP_FRA_ground_crews:0 "Train the Ground Crews"
 TPMP_FRA_ground_crews_desc:0 "Aircraft on the strength return are not necessarily aircraft ready to fly. Train fitters and organize the stock of serviceable spares."
 TPMP_FRA_dispersal_fields_tt:0 "Modify §YThe French Air Service§! by:\nAir Weather Penalty: §G-10%§!\nAir Mission Efficiency: §G+3%§!"
 TPMP_FRA_dispersal_fields:0 "Ready at the Dispersal Fields"
 TPMP_FRA_dispersal_fields_desc:0 "Prepare the service units to disperse and continue operating after an airfield is struck."
 TPMP_FRA_fighter_direction_tt:0 "Modify §YThe French Air Service§! by:\nInterception Efficiency: §G+10%§!\nAir XP: §G+25§!"
 TPMP_FRA_fighter_direction:0 "The Fighter Direction Posts"
 TPMP_FRA_fighter_direction_desc:0 "Link observers, airfields and fighter units. A useful interception system begins with warning that reaches the squadron in time."
 TPMP_FRA_battlefield_liaison_tt:0 "Modify §YThe French Air Service§! by:\nGround Support Efficiency: §G+8%§!\nAir XP: §G+25§!"
 TPMP_FRA_battlefield_liaison:0 "Air Liaison with the Army"
 TPMP_FRA_battlefield_liaison_desc:0 "Let the supported formation speak to the air unit. Better employment of the available aircraft is worth as much as another unattached squadron."
 TPMP_FRA_technical_missions_tt:0 "Modify §YThe French Air Service§! by:\nAircraft Design XP Cost: §G-10%§!\nPolitical Power: §G+35§!"
 TPMP_FRA_technical_missions:0 "The Allied Technical Missions"
 TPMP_FRA_technical_missions_desc:0 "Exchange test results and practical production experience with friendly air services. Keep the benefit in the workshops as well as the design office."
 TPMP_FRA_save_air_service_tt:0 "Modify §YThe French Air Service§! by:\nAir Mission Efficiency: §G+2%§!"
 TPMP_FRA_save_air_service:0 "Keep the Groups Flying"
 TPMP_FRA_save_air_service_desc:0 "The production programme has reached the squadrons. Organize replacement crews and servicing rotations so that the effort survives its first operational losses."
 TPMP_FRA_fleet_national_asset_tt:0 "Modify §YThe French Naval Service§! by:\nNaval Organization: §G+3%§!\nNavy XP: §G+25§!"
 TPMP_FRA_fleet_national_asset:0 "The Fleet Is a National Asset"
 TPMP_FRA_fleet_national_asset_desc:0 "Preserve an operational fleet with crews, repair services and a defined job in the Allied war."
 TPMP_FRA_great_hulls_tt:0 "Modify §YThe French Naval Service§! by:\nDockyard Output: §G+8%§!\nRefit Speed: §G+10%§!"
 TPMP_FRA_great_hulls:0 "Complete the Great Hulls"
 TPMP_FRA_great_hulls_desc:0 "Finish and maintain the capital ships already under construction. Their value depends on crews and repair capacity, not on a second fleet appearing by decree."
 TPMP_FRA_escort_service_tt:0 "Modify §YThe French Naval Service§! by:\nConvoy Escort Efficiency: §G+12%§!\nScreening Efficiency: §G+5%§!"
 TPMP_FRA_escort_service:0 "The Escort Service"
 TPMP_FRA_escort_service_desc:0 "Put useful screens and practiced escorts ahead of prestige. France's merchant traffic and future overseas army depend on them."
 TPMP_FRA_sea_lanes_tt:0 "Modify §YThe French Naval Service§! by:\nNaval Fuel Use: §G-8%§!"
 TPMP_FRA_sea_lanes:0 "France Must Still Have a Sea Road"
 TPMP_FRA_sea_lanes_desc:0 "Ships will carry the army’s stores and, if they must, its survivors. Give the escort service a route plan that can endure the loss of metropolitan ports."
 TPMP_FRA_overseas_anchorages_tt:0 "Modify §YThe French Naval Service§! by:\nNaval Range: §G+10%§!\nNaval Invasion Preparation Speed: §G+10%§!"
 TPMP_FRA_overseas_anchorages:0 "Prepare the Overseas Anchorages"
 TPMP_FRA_overseas_anchorages_desc:0 "Arrange maintenance stores and trained shore parties abroad. The bases must be able to receive the fleet France actually saves."
 TPMP_FRA_fleet_remains_french_tt:0 "Modify §YThe French Naval Service§! by:\nNaval Recovery Rate: §G+8%§!\nNavy XP: §G+30§!\nPolitical Power: §G+35§!"
 TPMP_FRA_fleet_remains_french:0 "The Fleet Must Remain French"
 TPMP_FRA_fleet_remains_french_desc:0 "Make continuity of command and maintenance a practical commitment. Preserve ships and relationships already in play; no Allied fleet is ours to confiscate."
 TPMP_FRA_national_reserve:0 "The National Reserve"
 TPMP_FRA_national_reserve_desc:0 "Finance up to three contracts before defeat: trained cadres, armaments or motor transport. Each takes 120 days and two civilian factories. Call mature reserves during the war; defeat automatically releases them. Pending contracts still finish overseas."
 TPMP_FRA_embarkation_lists_continuity_tt:0 "After actual capitulation: 8,000 evacuated personnel and a 120-day training advantage."
 TPMP_FRA_embarkation_lists:0 "The Men on the Embarkation Lists"
 TPMP_FRA_embarkation_lists_desc:0 "There will never be enough room for everything. Reserve places for the instructors, mechanics and officers who can turn a gathering overseas into another army."
 TPMP_FRA_technical_archives_tt:0 "Modify §YThe Republican Arsenal§! by:\nEquipment Conversion Speed: §G+10%§!"
 TPMP_FRA_technical_archives_continuity_tt:0 "After actual capitulation: +25 army XP and +25 air XP. The Allied equipment programme later grants a 50% maintenance-company research bonus."
 TPMP_FRA_technical_archives:0 "Carry the Drawings Out"
 TPMP_FRA_technical_archives_desc:0 "A machine may be abandoned; the men who understand it and the drawings that explain it must reach the next workshop."
 TPMP_FRA_last_trains_tt:0 "Modify §YThe French Army§! by:\nOut-of-Supply Penalty: §G-8%§!"
 TPMP_FRA_last_trains:0 "The Last Train Has a Destination"
 TPMP_FRA_last_trains_desc:0 "The evacuation orders must lead to an actual port and an actual receiving staff. Teach the rear services to move together when the peacetime timetable has collapsed."
 TPMP_FRA_fierce_resistance_tt:0 "Modify §YThe French Army§! by:\nDivision Defense: §G+3%§!\nDivision Recovery Rate: §G+3%§!\nArmy XP: §G+30§!\nWar Support: §G+5%§!"
 TPMP_FRA_fierce_resistance:0 "Make Them Pay for Every Month"
 TPMP_FRA_fierce_resistance_desc:0 "A prolonged campaign is not a route to permanent survival. It is time to fight, preserve cadres and leave the invader a harder occupation."
 TPMP_FRA_refus_absurde:0 "France Has Not Finished Fighting"
 TPMP_FRA_refus_absurde_desc:0 "The government has lost its capital. The men arriving overseas have lost much more. Gather them around a command that will still issue French orders tomorrow."
 TPMP_FRA_appel:0 "The Appeal to the French Nation"
 TPMP_FRA_appel_desc:0 "There must be a place for those who refuse to stop. Open the depots for the first volunteers and assemble the modest force from which the return will begin."
 TPMP_FRA_eboue:0 "Éboué Answers from Chad"
 TPMP_FRA_eboue_desc:0 "The movement has a voice in London. Éboué gives it officials, workshops and a territory from which men can march. Now the promise of a fighting France has a place on the map."
 TPMP_FRA_national_committee_tt:0 "Modify §YThe Army and State of Liberation§! by:\nLegitimacy Gain Factor: §G+10%§!"
 TPMP_FRA_national_committee:0 "A State without Its Capital"
 TPMP_FRA_national_committee_desc:0 "Appointments, accounts and military orders still have to bear an authority. Gather the scattered services into a French committee that can act and answer for its decisions."
 TPMP_FRA_brazzaville_workshops:0 "The Workshops of Brazzaville"
 TPMP_FRA_brazzaville_workshops_desc:0 "Boots, uniforms, repaired trucks and stocked depots make an expedition possible. Rebuild around the overseas services and the technical preparations France saved."
 TPMP_FRA_intendance_tt:0 "Modify §YThe Army and State of Liberation§! by:\nSupply Use: §G-3%§!"
 TPMP_FRA_intendance:0 "The Intendance Makes an Army"
 TPMP_FRA_intendance_desc:0 "The volunteer has a rifle. He still needs boots, rations, a mechanic and a man who knows where tomorrow’s water is coming from."
 TPMP_FRA_radio_brazzaville_tt:0 "Modify §YThe Army and State of Liberation§! by:\nDaily Political Power: §G+0.1§!"
 TPMP_FRA_radio_brazzaville:0 "Brazzaville Speaks to France"
 TPMP_FRA_radio_brazzaville_desc:0 "The transmitters carry the news across territories and seas. Tell the occupied country where Frenchmen are fighting, and tell the volunteers that their country can still hear them."
 TPMP_FRA_allies_not_dependents_tt:0 "Modify §YThe Army and State of Liberation§! by:\nCommand Power Gain Mult: §G+10%§!"
 TPMP_FRA_allies_not_dependents:0 "A French Voice at Allied Headquarters"
 TPMP_FRA_allies_not_dependents_desc:0 "Our force is small enough to be overlooked and too important to us to be scattered without a voice. Establish officers who can speak for its employment and its future."
 TPMP_FRA_column_can_depart_tt:0 "Modify §YThe Army and State of Liberation§! by:\nSupply Use: §G-5%§!\nAcclimatization Hot Climate Gain Factor: §G+15%§!\nArmy XP: §G+25§!"
 TPMP_FRA_column_can_depart:0 "The Column Can Depart"
 TPMP_FRA_column_can_depart_desc:0 "The water has been counted, the loads checked and the route passed to the drivers. The workshops have done what they can. The next entry in the movement’s story will be written on the road."
 TPMP_FRA_anfa:0 "An Army the Allies Can Equip"
 TPMP_FRA_anfa_desc:0 "An Allied division table cannot become a French army by signature alone. Send officers to learn its equipment, reconcile the establishments and bring the instructions back to the camps."
 TPMP_FRA_two_armies_tt:0 "Modify §YThe Army and State of Liberation§! by:\nDivision Organization: §G+4%§!\nArmy Training Time: §G-8%§!\nArmy XP: §G+40§!\nStability: §G+5%§!"
 TPMP_FRA_two_armies:0 "Two Armies, One France"
 TPMP_FRA_two_armies_desc:0 "Reconcile the Free French and North African military traditions through common training and support. Retain the identities and experience of formations already in service."
 TPMP_FRA_army_liberation_tt:0 "Modify §YThe Army and State of Liberation§! by:\nDivision Recovery Rate: §G+5%§!"
 TPMP_FRA_army_liberation:0 "The Army of Liberation"
 TPMP_FRA_army_liberation_desc:0 "A small specialist army with a coherent establishment can give the Allies something distinctive. Organize enough permanent industry to maintain that contribution."
 TPMP_FRA_choose_contribution:0 "Our Place in the Allied Battle"
 TPMP_FRA_choose_contribution_desc:0 "France cannot rebuild every arm at once. Choose the principal contribution of its returning army: mountain assault, amphibious entry or mobile exploitation."
 TPMP_FRA_mountain_corps_tt:0 "Modify §YThe Army and State of Liberation§! by:\nSpecial Forces Battalion Capacity: §G+8§!\nSpecial Forces Attack: §G+6%§!\nSpecial Forces Out-of-Supply Penalty: §G-10%§!\nMountaineers in Mountains: Attack §G+10%§!, Movement §G+10%§!."
 TPMP_FRA_mountain_corps:0 "Juin: The Enemy’s Impossible Ground"
 TPMP_FRA_mountain_corps_desc:0 "Where the road ends, the enemy expects the attack to end with it. Build an expeditionary corps that can carry its support over the heights and appear on an unexpected flank."
 TPMP_FRA_kieffer_tt:0 "Modify §YThe Army and State of Liberation§! by:\nSpecial Forces Battalion Capacity: §G+8§!\nAmphibious Attack: §G+10%§!\nSpecial Forces Supply Grace (hours): §G+48§!\nMarines: River Attack §G+10%§!, Marsh Movement §G+10%§!."
 TPMP_FRA_kieffer:0 "Kieffer: First onto French Soil"
 TPMP_FRA_kieffer_desc:0 "The landing force needs a task it can finish before its support arrives. Train small assault groups to force an entrance and organize the ground they have won."
 TPMP_FRA_leclerc_tt:0 "Modify §YThe Army and State of Liberation§! by:\nArmor Attack: §G+6%§!\nArmor Speed: §G+8%§!\nDivision Recovery Rate: §G+4%§!"
 TPMP_FRA_leclerc:0 "Leclerc: Never Give Them Time"
 TPMP_FRA_leclerc_desc:0 "The column cannot win by becoming a smaller version of every Allied army. Give it the reconnaissance, maintenance and command habits to turn an opening into a pursuit."
 TPMP_FRA_mule_and_radio_tt:0 "Modify §YThe Army and State of Liberation§! by:\nSpecial Forces Attack: §G+5%§!\nSupply Use: §G-4%§!"
 TPMP_FRA_mule_and_radio:0 "The Mule and the Radio"
 TPMP_FRA_mule_and_radio_desc:0 "The difficult ground rewards small-unit coordination and reliable carriage. Keep specialist troops supplied beyond the roadhead."
 TPMP_FRA_ports_provence_tt:0 "Modify §YThe Army and State of Liberation§! by:\nAmphibious Attack: §G+8%§!\nNaval Invasion Preparation Speed: §G+20%§!"
 TPMP_FRA_ports_provence:0 "Win the Harbor"
 TPMP_FRA_ports_provence_desc:0 "A flag on the sand is a beginning. Find the harbor, clear its approaches and make the landing useful to the formations following it."
 TPMP_FRA_oath_koufra_tt:0 "Modify §YThe Army and State of Liberation§! by:\nSupply Use: §G-4%§!\nArmor Defense: §G+5%§!"
 TPMP_FRA_oath_koufra:0 "Koufra to Strasbourg"
 TPMP_FRA_oath_koufra_desc:0 "Strasbourg is very far from this oasis. Our trucks are worn and our stores uncertain. Give the column a destination that can survive every detour on the road home."
 TPMP_FRA_specialist_establishment_tt:0 "Modify §YThe Army and State of Liberation§! by:\nDivision Organization: §G+3%§!\nEquipment Capture: §G+5%§!\nArmy XP: §G+35§!\nOffsite Military Factories: §G+2§!"
 TPMP_FRA_specialist_establishment:0 "The Allies Know What We Can Do"
 TPMP_FRA_specialist_establishment_desc:0 "Give the chosen force a stable headquarters, a support establishment and officers who understand its task. The Allied battle plan should have a place that this French army can fill."
 TPMP_FRA_bir_hakeim_tt:0 "Modify §YThe Army and State of Liberation§! by:\nDivision Recovery Rate: §G+5%§!\nWar Support: §G+8%§!\nArmy XP: §G+35§!"
 TPMP_FRA_bir_hakeim:0 "Bir Hakeim: The Flag Is Still Flying"
 TPMP_FRA_bir_hakeim_desc:0 "A force that holds together under pressure gives the movement something no broadcast can provide. Bring its veterans back into the army and let their example train the next battalions."
 TPMP_FRA_ready_expedition_tt:0 "Modify §YThe Army and State of Liberation§! by:\nNaval Invasion Preparation Speed: §G+10%§!"
 TPMP_FRA_ready_expedition:0 "The Embarkation Exercise"
 TPMP_FRA_ready_expedition_desc:0 "Load the force, its headquarters and its support train against one sailing plan. Discover the missing instructions while the ships are still alongside."
 TPMP_FRA_french_ensign_tt:0 "Modify §YThe French Naval Service§! by:\nConvoy Escort Efficiency: §G+4%§!"
 TPMP_FRA_french_ensign:0 "Muselier: A French Flag at Sea"
 TPMP_FRA_french_ensign_desc:0 "Every escort is a command, a crew and a visible claim that France remains at war. Make the small naval service useful along the routes the overseas army depends on."
 TPMP_FRA_aconit_tt:0 "Modify §YThe French Naval Service§! by:\nConvoy Escort Efficiency: §G+10%§!\nNaval Detection: §G+6%§!"
 TPMP_FRA_aconit:0 "Aconit: Stay with the Convoy"
 TPMP_FRA_aconit_desc:0 "The escort’s task is to bring the convoy through. Train the watch, contact reporting and depth-charge parties around that duty."
 TPMP_FRA_repair_crews_tt:0 "Modify §YThe French Naval Service§! by:\nRefit Speed: §G+15%§!\nOffsite Dockyards: §G+2§!"
 TPMP_FRA_repair_crews:0 "The Dockyard Keeps the Ensign Flying"
 TPMP_FRA_repair_crews_desc:0 "Behind the corvette’s next sailing stand fitters, welders and a shore party working through the night. Give the surviving ships a service that can send them out again."
 TPMP_FRA_passy_tt:0 "Modify §YThe Army and State of Liberation§! by:\nIntel Network Gain Factor: §G+15%§!"
 TPMP_FRA_passy:0 "Passy's Address Book"
 TPMP_FRA_passy_desc:0 "Build communications with occupied France. Intelligence, escape routes and political acceptance are different tasks, even when they share a radio operator."
 TPMP_FRA_radios_landing_grounds_tt:0 "Modify §YThe Army and State of Liberation§! by:\nIntel From Operatives Factor: §G+10%§!"
 TPMP_FRA_radios_landing_grounds:0 "The Wireless Must Get Through"
 TPMP_FRA_radios_landing_grounds_desc:0 "A safe house and a working set can matter more than a crowded headquarters abroad. Build the links through which the interior can speak and be heard."
 TPMP_FRA_moulin_tt:0 "Modify §YThe Army and State of Liberation§! by:\nResistance Growth On Our Occupied States: §G+8%§!"
 TPMP_FRA_moulin:0 "Moulin's Mandate"
 TPMP_FRA_moulin_desc:0 "Send a delegate to negotiate with the movements. Political unity must be earned through agreement rather than assumed from a broadcast."
 TPMP_FRA_interior_together_tt:0 "Modify §YThe Army and State of Liberation§! by:\nLegitimacy Gain Factor: §G+10%§!\nResistance Growth On Our Occupied States: §G+7%§!"
 TPMP_FRA_interior_together:0 "Forty-Eight Rue du Four"
 TPMP_FRA_interior_together_desc:0 "They have come by different routes and represent different Frances. Before they leave this room, the movements, parties and unions must find a way to speak together."
 TPMP_FRA_prepare_authorities_tt:0 "Modify §YThe Army and State of Liberation§! by:\nIndustry Repair Factor: §G+20%§!"
 TPMP_FRA_prepare_authorities:0 "The Republic Arrives with the Army"
 TPMP_FRA_prepare_authorities_desc:0 "Prepare administrators, liaison officers and civil records before the landing. A government is more than its combat contingent."
 TPMP_FRA_programme_resistance_tt:0 "Modify §YThe Army and State of Liberation§! by:\nWeekly Manpower: §G+350§!"
 TPMP_FRA_programme_resistance:0 "The Programme of the Resistance"
 TPMP_FRA_programme_resistance_desc:0 "Make a concrete commitment to the Republic which liberation will restore. Its promises should have a political cost and a durable social result."
 TPMP_FRA_provisional_government:0 "A National Government in Fact"
 TPMP_FRA_provisional_government_desc:0 "Civil authority and the Army of Liberation now support the same claim. France returns as a sovereign participant in the Allied war."
 TPMP_FRA_return_to_france_tt:0 "Modify §YThe Army and State of Liberation§! by:\nDivision Attack: §G+4%§!"
 TPMP_FRA_return_to_france:0 "We Return as a French Army"
 TPMP_FRA_return_to_france_desc:0 "The units sailing for France carry more than their establishments. They carry a national command and the claim that the country will help decide its own liberation."
 TPMP_FRA_paris_tt:0 "Modify §YThe Army and State of Liberation§! by:\nCore Territory Attack: §G+8%§!\nCore Territory Defense: §G+8%§!"
 TPMP_FRA_paris:0 "Paris Returns to France"
 TPMP_FRA_paris_desc:0 "The returning soldiers find a city that has already fought for its freedom. Restore the national command to the capital and carry the liberation beyond its streets."
 TPMP_FRA_oath_fulfilled_tt:0 "Modify §YThe Army and State of Liberation§! by:\nDivision Recovery Rate: §G+5%§!\nArmy XP: §G+40§!\nWar Support: §G+5%§!"
 TPMP_FRA_oath_fulfilled:0 "The Oath Fulfilled"
 TPMP_FRA_oath_fulfilled_desc:0 "The city that seemed impossibly far from the desert camps is free. Remember the absent men who carried its name, then give the survivors their next orders."
 TPMP_FRA_republic_resumes:0 "The Republic Resumes Its Work"
 TPMP_FRA_republic_resumes_desc:0 "The ministries return to buildings with broken windows and missing files. Reopen the services, repair the workshops and make the arrival of the government useful to the people who endured the occupation."
 TPMP_FRA_beyond_rhine_tt:0 "Modify §YThe Army and State of Liberation§! by:\nSupply Use: §G-3%§!\nDivision Attack: §G+3%§!\nArmy XP: §G+35§!"
 TPMP_FRA_beyond_rhine:0 "Beyond the Rhine"
 TPMP_FRA_beyond_rhine_desc:0 "The returned specialist army remains France's contribution to victory. Keep its accumulated identity and experience for the last campaign."
 TPMP_FRA_seat_at_table:0 "A Seat at the Table"
 TPMP_FRA_seat_at_table_desc:0 "France has returned with a government, a fighting army and a claim to participate in the settlement. The country's story continues beyond its defeat."
 TPMP_FRA_foreign_stores:0 "Make Foreign Patterns Work"
 TPMP_FRA_foreign_stores_desc:0 "The weapons in the Allied depot were built to somebody else’s drawings. Choose a short conversion and repair effort so the workshops can support mixed equipment immediately."
 TPMP_FRA_workshop_surge:0 "A Common Pattern"
 TPMP_FRA_workshop_surge_desc:0 "Stop changing the work at every new requisition. Commit the small factories to a common pattern, accepting a short disruption in return for a dependable local series."
 TPMP_FRA_forty_hours:0 "The Forty-Hour Settlement"
 TPMP_FRA_forty_hours_desc:0 "Buy social confidence with a peacetime production concession. Later emergency legislation can recover the lost output."
 TPMP_FRA_office_ble_tt:0 "Modify §YThe French Army§! by:\nSupply Use: §G-2%§!"
 TPMP_FRA_office_ble:0 "Bread for the Republic"
 TPMP_FRA_office_ble_desc:0 "The farmers need a dependable price and the towns need bread. Put the grain service on a footing that can sustain the country through mobilization."
 TPMP_FRA_collective_contracts:0 "The Settlement Reaches the Arsenal"
 TPMP_FRA_collective_contracts_desc:0 "Carry the agreement from the negotiating table to the shop floor. Stable shifts and common series will give the workers and the purchasing service a programme they can both keep."
 TPMP_FRA_industrial_partners:0 "Bring the Industrial Partners In"
 TPMP_FRA_industrial_partners_desc:0 "Exchange public purchasing guarantees for private investment. Productive capacity grows, but civilian obligations absorb part of the gain."
 TPMP_FRA_organize_professions:0 "Organize the Professions"
 TPMP_FRA_organize_professions_desc:0 "Standardize apprenticeship and workshop qualifications across the conservative coalition. The useful payoff is faster entry into a production series."
 TPMP_FRA_parliamentary_guarantees:0 "Parliamentary Guarantees"
 TPMP_FRA_parliamentary_guarantees_desc:0 "Keep the right-wing settlement inside republican institutions and settle the authority of the elected cabinet."
 TPMP_FRA_emergency_credits:0 "The Chamber Votes the Credits"
 TPMP_FRA_emergency_credits_desc:0 "The government must ask the Chamber for money and responsibility together. Pass the emergency credits while the work they can finance still has time to reach the army."
 TPMP_FRA_emergency_legislation:0 "The Night Shift and the Republic"
 TPMP_FRA_emergency_legislation_desc:0 "Bring the peacetime settlements back to the table. Longer hours will ask more of the workers and test the confidence that made the armaments programme possible."
 TPMP_FRA_triple_defence:0 "Triple the Defense Appropriations"
 TPMP_FRA_triple_defence_desc:0 "Front-load the armaments effort for the opening war. Consumer production and public confidence pay for a large but temporary drive."
 TPMP_FRA_civilian_settlement:0 "A Sustainable War Economy"
 TPMP_FRA_civilian_settlement_desc:0 "Retain more civil capacity and improve the efficiency ceiling. The result matures less spectacularly than emergency military output."
 TPMP_FRA_policy_firmness:0 "A Policy of Firmness"
 TPMP_FRA_policy_firmness_desc:0 "Give the war cabinet authority to fund the army and the practical preparations for national continuity."
 TPMP_FRA_france_en_avant:0 "La France en Avant!"
 TPMP_FRA_france_en_avant_desc:0 "The cabinet has its authority and the arsenals their orders. The men at the frontier now carry the result of every argument in the Chamber and every shift worked through the night."
 TPMP_FRA_industrial_credit:0 "Loans to the Subcontractors"
 TPMP_FRA_industrial_credit_desc:0 "Finance small firms which can actually deliver during the next production window. The fund cannot be renewed until the first credit has run its course."
 TPMP_FRA_market_fund:0 "The National Equipment Fund"
 TPMP_FRA_market_fund_desc:0 "Renew a completed credit cycle and add durable civilian capacity. Waiting for the first loan period is a visible part of the choice."
 TPMP_FRA_common_gauges:0 "Common Gauges and Acceptance"
 TPMP_FRA_common_gauges_desc:0 "Make interchangeable parts more than a specification on paper. A mature inspection service improves output without discarding established tooling."
 TPMP_FRA_saint_etienne:0 "The Saint-Étienne Lines"
 TPMP_FRA_saint_etienne_desc:0 "Expand metropolitan small-arms capacity while the campaign is still ahead. Its immediate value competes with investing in an overseas fallback."
 TPMP_FRA_tulle_cartridges:0 "Tulle Keeps the Rifles Firing"
 TPMP_FRA_tulle_cartridges_desc:0 "The cartridge is less celebrated than the rifle and consumed far more quickly. Settle the small-arms contracts around ammunition, spare parts and interchangeable fittings."
 TPMP_FRA_schneider_orders:0 "Schneider: The Battery as a System"
 TPMP_FRA_schneider_orders_desc:0 "The gun, its sights, ammunition and towing arrangements belong to one programme. The artillery bureau will test a complete battery before placing the next series."
 TPMP_FRA_automobile_contracts:0 "Renault, Berliet and the Army Road"
 TPMP_FRA_automobile_contracts_desc:0 "France has motor manufacturers. The army needs a transport service: common loads, repair instructions and vehicles its mechanics can keep on the road."
 TPMP_FRA_tank_series:0 "One Chassis, One Series"
 TPMP_FRA_tank_series_desc:0 "Commit tooling to an economical armor series. The alternative puts more resources into protected breakthrough vehicles."
 TPMP_FRA_protected_castings:0 "The Heavy Casting Programme"
 TPMP_FRA_protected_castings_desc:0 "Pay more per hull to improve armor construction. The benefits favor deliberate breakthrough formations rather than a cheap vehicle race."
 TPMP_FRA_african_machine_shops:0 "Machine Shops Beyond the Mediterranean"
 TPMP_FRA_african_machine_shops_desc:0 "Construct a small physical African fallback before defeat. These factories are real territorial assets and are not copied a second time in exile."
 TPMP_FRA_port_stores_continuity_tt:0 "Desert staging posts later gain an additional -3% out-of-supply penalty from this preparation."
 TPMP_FRA_port_stores:0 "The Other Shore Must Be Ready"
 TPMP_FRA_port_stores_desc:0 "The workshops across the Mediterranean will be useless without a port service. Prepare fuel accounting, unloading parties and depots while the crossings are still routine."
 TPMP_FRA_long_series:0 "Keep the Series Running"
 TPMP_FRA_long_series_desc:0 "A stable series can give the last prewar production window real weight. The output drive ends after 180 days; established cost reductions remain."
 TPMP_FRA_class_b:0 "Recall the Territorial Officers"
 TPMP_FRA_class_b_desc:0 "The reserve regiments have names and depots. Recall the officers who know them, refresh their instructions and give the mobilization a human framework."
 TPMP_FRA_field_fortification_tt:0 "Modify §YThe French Army§! by:\nMaximum Entrenchment: §G+1§!\nEntrenchment Speed: §G+10%§!"
 TPMP_FRA_field_fortification:0 "The Interval Troops"
 TPMP_FRA_field_fortification_desc:0 "Concrete cannot patrol the ground between the ouvrages. Teach the field formations to prepare alternate positions, cover their neighbors and keep a road open behind them."
 TPMP_FRA_massed_artillery_tt:0 "Modify §YThe French Army§! by:\nMaximum Planning: §G+4%§!"
 TPMP_FRA_massed_artillery:0 "The Fire Plan Belongs to the Infantry"
 TPMP_FRA_massed_artillery_desc:0 "Surveyors, observers and infantry commanders must agree where the barrage is going. Practice shifting the weight of fire while the battle is moving."
 TPMP_FRA_professional_corps_tt:0 "Modify §YThe French Army§! by:\nPlanning Speed: §G+8%§!\nDivision Recovery Rate: §G+2%§!"
 TPMP_FRA_professional_corps:0 "The Covering Force Moves First"
 TPMP_FRA_professional_corps_desc:0 "The frontier crisis will not wait for every reservist. Keep the covering formations trained, mobile and ready to buy the rest of the army its mobilization time."
 TPMP_FRA_anti_tank_schools:0 "One Cannot Fight Tanks with Rifles"
 TPMP_FRA_anti_tank_schools_desc:0 "Teach crews to recognize an approach, hold their fire and change position after engaging. A gun in the establishment is useful when its section survives to fire again."
 TPMP_FRA_war_council_continuity_tt:0 "Starts 120 days of command reform. Temporary organization/recovery costs ease after 60 days; the final command improvement arrives after 120."
 TPMP_FRA_war_council:0 "Reform the War Council"
 TPMP_FRA_war_council_desc:0 "Start an institutional transition which continues after the focus. Reorganization initially costs cohesion; a first improvement arrives after 60 days and mature staff practice after 120."
 TPMP_FRA_signals_exercises:0 "The Command Post Under Fire"
 TPMP_FRA_signals_exercises_desc:0 "Move the headquarters during an exercise. Cut its preferred circuit. Make its officers recover the picture while the formations continue to fight."
 TPMP_FRA_mobile_workshops_tt:0 "Modify §YThe French Army§! by:\nEquipment Capture: §G+5%§!\nDivision Recovery Rate: §G+3%§!"
 TPMP_FRA_mobile_workshops:0 "Bring the Damaged Tanks Home"
 TPMP_FRA_mobile_workshops_desc:0 "The battlefield is not the end of a vehicle’s service life. Recover what can be towed, record what failed and send the next crew out with a machine the fitters understand."
 TPMP_FRA_sustained_breakthrough_tt:0 "Modify §YThe French Army§! by:\nArmor Defense: §G+3%§!\nPlanning Speed: §G+5%§!"
 TPMP_FRA_sustained_breakthrough:0 "The Infantry Goes Through the Breach"
 TPMP_FRA_sustained_breakthrough_desc:0 "A tank across the obstacle is a beginning. Pass the engineers and infantry through before the enemy can close the shoulders of the penetration."
 TPMP_FRA_ammunition_park_tt:0 "Modify §YThe French Army§! by:\nSupply Use: §G-2%§!"
 TPMP_FRA_ammunition_park:0 "The Ammunition Road Stays Open"
 TPMP_FRA_ammunition_park_desc:0 "The batteries are firing. Now keep the supply columns moving without choking the roads the reserve needs for its counterattack."
 TPMP_FRA_junior_leaders_tt:0 "Modify §YThe French Army§! by:\nDivision Experience Gain: §G+10%§!\nReinforce Rate: §G+1%§!\nArmy XP: §G+30§!"
 TPMP_FRA_junior_leaders:0 "The Junior Leaders Carry the Battle"
 TPMP_FRA_junior_leaders_desc:0 "Strengthen the layer between the staff plan and the section. The payoff is experienced formations and quicker recovery from local disruption."
 TPMP_FRA_rearguard_schools_tt:0 "Modify §YThe French Army§! by:\nOut-of-Supply Penalty: §G-6%§!"
 TPMP_FRA_rearguard_schools:0 "The Rearguard Brings Its Men Back"
 TPMP_FRA_rearguard_schools_desc:0 "A withdrawal needs its own commanders, timings and protected routes. Preserve the men who can teach the next army what happened to this one."
 TPMP_FRA_aviation_populaire:0 "Aviation Populaire"
 TPMP_FRA_aviation_populaire_desc:0 "Expand the pool of trained pilots and instructors, then use it to sustain French operational groups."
 TPMP_FRA_engine_consortium:0 "An Engine for the Programme"
 TPMP_FRA_engine_consortium_desc:0 "A new airframe without a reliable engine is another unfinished promise. Pool engine testing and acceptance while the factories learn common production practice."
 TPMP_FRA_fighter_orders:0 "The CEMA Tests the Next Fighter"
 TPMP_FRA_fighter_orders_desc:0 "The prototype must answer the test pilots before it answers a production order. Fund a fighter evaluation programme whose results can reach the drawing office."
 TPMP_FRA_cas_groups_tt:0 "Modify §YThe French Air Service§! by:\nGround Support Efficiency: §G+4%§!"
 TPMP_FRA_cas_groups:0 "The Observer Flies with the Army"
 TPMP_FRA_cas_groups_desc:0 "Aircrews and infantry officers must learn one another’s maps, signals and limits. The cooperation group exists to find the battle and stay useful over it."
 TPMP_FRA_barrage_david_tt:0 "Modify §YThe French Air Service§! by:\nInterception Efficiency: §G+6%§!"
 TPMP_FRA_barrage_david:0 "The David Warning Network"
 TPMP_FRA_barrage_david_desc:0 "An observer’s report must reach the fighter post while it still describes an approaching raid. Connect the warning stations, telephones and controllers into an interception service."
 TPMP_FRA_arsenal_aeronautique:0 "The Arsenal de l’Aéronautique"
 TPMP_FRA_arsenal_aeronautique_desc:0 "Complete the production reform and fund experimental work. The remaining aircraft surcharge disappears and the test service opens a research slot."
 TPMP_FRA_battlefield_bombers_tt:0 "Modify §YThe French Air Service§! by:\nAir Mission Efficiency: §G+2%§!"
 TPMP_FRA_battlefield_bombers:0 "The Battle beyond the Front Line"
 TPMP_FRA_battlefield_bombers_desc:0 "The enemy’s reinforcement columns and junctions belong to the same battle as his leading troops. Train the bombing groups to find them and work to an operational plan."
 TPMP_FRA_air_service_overseas:0 "The Air Staff Closes the Loop"
 TPMP_FRA_air_service_overseas_desc:0 "A combat report should return to the school and the drawing office. Give the air staff an orderly route from operational lessons to the next aircraft programme."
 TPMP_FRA_richelieu_trials:0 "Richelieu Must Be Ready"
 TPMP_FRA_richelieu_trials_desc:0 "The hull is an undertaking of national scale; the trials turn it into a fighting ship. Concentrate the fitting-out crews and resolve the faults that still stand between the fleet and its investment."
 TPMP_FRA_escort_hulls:0 "A Series of Escort Hulls"
 TPMP_FRA_escort_hulls_desc:0 "Trade a year of inexpensive escort production against heavier construction priorities."
 TPMP_FRA_refit_programme:0 "Modernize the Ships We Have"
 TPMP_FRA_refit_programme_desc:0 "Commit civilian repair capacity for six months to a focused refit programme. The civilian cost is real and ends with the temporary spirit."
 TPMP_FRA_naval_workshops:0 "Workshops at the Overseas Anchorages"
 TPMP_FRA_naval_workshops_desc:0 "Add a modest physical dockyard base in controlled Africa. It may survive the metropolitan defeat; its ownership remains part of the campaign."
 TPMP_FRA_aeronavale:0 "The Aéronavale Searches Ahead"
 TPMP_FRA_aeronavale_desc:0 "A contact report is a fleeting opportunity. Train the crews to identify a target, report it and guide the fleet toward it before the sea is empty again."
 TPMP_FRA_fleet_train_tt:0 "Modify §YThe French Naval Service§! by:\nNaval Fuel Use: §G-5%§!"
 TPMP_FRA_fleet_train:0 "The Fleet Has a Tail"
 TPMP_FRA_fleet_train_desc:0 "The fighting ships depend on tankers, storekeepers and repair parties. Keep that unglamorous service close enough to sustain the fleet and dispersed enough to survive."
 TPMP_FRA_coastal_cooperation_tt:0 "Modify §YThe French Naval Service§! by:\nNaval Detection: §G+4%§!\nConvoy Escort Efficiency: §G+5%§!\nNavy XP: §G+30§!"
 TPMP_FRA_coastal_cooperation:0 "Cooperate with the Coastal Commands"
 TPMP_FRA_coastal_cooperation_desc:0 "Link escorts, warning stations and naval aircraft into a useful convoy service."
 TPMP_FRA_march_battalions:0 "The March Schools"
 TPMP_FRA_march_battalions_desc:0 "Men from distant garrisons and volunteer groups must learn to serve in the same formation. Put experienced officers and instructors into the depots before sending new battalions out."
 TPMP_FRA_workshop_crews:0 "Train the Fitters"
 TPMP_FRA_workshop_crews_desc:0 "Use scarce technical personnel to sustain the equipment actually in service, with a modest repair and conversion specialty."
 TPMP_FRA_desert_stages_tt:0 "Modify §YThe Army and State of Liberation§! by:\nOut-of-Supply Penalty: §G-5%§!"
 TPMP_FRA_desert_stages_continuity_tt:0 "If the overseas port service was prepared before defeat: an additional -3% out-of-supply penalty."
 TPMP_FRA_desert_stages:0 "The Road from Chad"
 TPMP_FRA_desert_stages_desc:0 "An expedition crosses the desert by stages: water, fuel, a workshop, then another stretch of empty road. Write the route into the quartermaster’s plan before the column departs."
 TPMP_FRA_training_camps:0 "The Camps Become an Army"
 TPMP_FRA_training_camps_desc:0 "The recruits arrive with different drill, equipment and memories of the defeat. The instructors have to make them ready to march under one command."
 TPMP_FRA_common_establishment_tt:0 "Modify §YThe Army and State of Liberation§! by:\nReinforce Rate: §G+1%§!"
 TPMP_FRA_common_establishment:0 "One Army, One Staff Table"
 TPMP_FRA_common_establishment_desc:0 "The uniforms and memories will remain different. The artillery call, replacement request and march order must mean the same thing wherever they are received."
 TPMP_FRA_second_anfa_tranche_tt:0 "Modify §YThe Army and State of Liberation§! by:\nExperience Loss Factor: §R-10%§!"
 TPMP_FRA_second_anfa_tranche:0 "The Replacement Echelons"
 TPMP_FRA_second_anfa_tranche_desc:0 "The first campaign will consume crews as surely as equipment. Keep an instructor and replacement service behind the field army so that its hard-won habits survive the next losses."
 TPMP_FRA_legion_cadre:0 "The Legion Teaches the Newcomers"
 TPMP_FRA_legion_cadre_desc:0 "Use the veterans as instructors. A small professional nucleus can teach more men than another isolated battalion can carry into battle."
 TPMP_FRA_mountain_columns_tt:0 "Modify §YThe Army and State of Liberation§! by:\nSpecial Forces Out-of-Supply Penalty: §G-5%§!"
 TPMP_FRA_mountain_columns:0 "Take the Guns off the Road"
 TPMP_FRA_mountain_columns_desc:0 "The infantry has crossed the ridge. Its support must follow in loads men and animals can carry, with observers close enough to make the fire count."
 TPMP_FRA_open_mountain_way_continuity_tt:0 "If France perfected the Methodical Battle: mountaineers gain an additional +5% mountain defense."
 TPMP_FRA_open_mountain_way:0 "There Is Always Another Ridge"
 TPMP_FRA_open_mountain_way_desc:0 "Make mountain movement a practiced method rather than a single heroic march. The next height must open another route for the army behind the corps."
 TPMP_FRA_commando_school:0 "Achnacarry"
 TPMP_FRA_commando_school_desc:0 "Let the volunteers learn the commando method, then give their officers a French school that can teach it to the next intake."
 TPMP_FRA_engineers_ashore_tt:0 "Modify §YThe Army and State of Liberation§! by:\nSpecial Forces Supply Grace (hours): §G+24§!"
 TPMP_FRA_engineers_ashore:0 "The Engineers Go in with the First Wave"
 TPMP_FRA_engineers_ashore_desc:0 "The first assault needs paths through the obstacles and a supply margin when the unloading plan fails. Teach the engineers to work inside the fight."
 TPMP_FRA_assault_echelon_continuity_tt:0 "If France trained the Interval Troops: marines gain an additional +5% river attack."
 TPMP_FRA_assault_echelon:0 "From the Beachhead to the Riverbank"
 TPMP_FRA_assault_echelon_desc:0 "Keep the assault troops useful inland. The riverbank asks many of the same questions as the beach, with less room and fewer boats."
 TPMP_FRA_mobile_cadre:0 "A Divisional Staff"
 TPMP_FRA_mobile_cadre_desc:0 "A division needs traffic discipline, artillery timings and a headquarters that can move. Teach the cadre to lead the force it intends to become."
 TPMP_FRA_recovery_echelons_tt:0 "Modify §YThe Army and State of Liberation§! by:\nEquipment Capture: §G+5%§!"
 TPMP_FRA_recovery_echelons:0 "No Vehicle Left for the Enemy"
 TPMP_FRA_recovery_echelons_desc:0 "The recovery parties follow the column with tools, towing cables and yesterday’s battle reports. Keep experienced crews and repairable machines inside the campaign."
 TPMP_FRA_division_strasbourg_tt:0 "Modify §YThe Army and State of Liberation§! by:\nArmor Speed: §G+3%§!"
 TPMP_FRA_division_strasbourg_continuity_tt:0 "If France developed the DLM: motorized and mechanized troops gain +5% breakthrough."
 TPMP_FRA_division_strasbourg:0 "A Division Worthy of the Oath"
 TPMP_FRA_division_strasbourg_desc:0 "The promise now has a divisional staff and a working transport service. Rehearse the advance as a formation that can keep moving after its first success."
 TPMP_FRA_escape_lines:0 "The Pyrenees Have Many Paths"
 TPMP_FRA_escape_lines_desc:0 "A guide, a safe room and a contact beyond the frontier can return a trained man to the war. Connect the escape routes to the depots waiting for their arrivals."
 TPMP_FRA_supply_maquis:0 "The Maquis Ask for Weapons"
 TPMP_FRA_supply_maquis_desc:0 "The messages list rifles, explosives and wireless batteries. Commit stores from the army’s own depots and sustain the groups preparing to fight behind the occupation lines."
 TPMP_FRA_plan_vert:0 "Plan Vert: Cut the Railway Arteries"
 TPMP_FRA_plan_vert_desc:0 "Wait for the moment when a broken line and a missing train can matter to the campaign. Commit the prepared networks to a brief, concentrated effort against the occupier’s communications."
 TPMP_FRA_civil_liaison:0 "The Civil Liaison Teams"
 TPMP_FRA_civil_liaison_desc:0 "Prepare the administrators and technical services who can make liberated districts useful to the army."
 TPMP_FRA_ports_receive:0 "Open the Port, Open the Front"
 TPMP_FRA_ports_receive_desc:0 "Clear the quays, restore the workshops and put the unloading parties to work. The returning army needs a port that can receive tomorrow’s formation as well as today’s."
 TPMP_FRA_provence_authorities:0 "The Authorities in Provence"
 TPMP_FRA_provence_authorities_desc:0 "Extend prepared French administration behind a friendly bridgehead. Progress accepts a liberated European French core, regardless of which Ally holds it."
 TPMP_FRA_interior_in_arms:0 "The Interior Joins the Army"
 TPMP_FRA_interior_in_arms_desc:0 "Men who fought in small groups now report to an army returning through their towns. Find their officers, record their service and bring them into the formations that will carry the war onward."
 TPMP_FRA_restore_workshops:0 "Light the Furnaces Again"
 TPMP_FRA_restore_workshops_desc:0 "The machines are damaged, the power uncertain and the workers scattered. Bring the repair teams and the surviving foremen together around the first production orders of the liberated Republic."
 TPMP_FRA_rhine_crossings:0 "The Last Great Crossing"
 TPMP_FRA_rhine_crossings_desc:0 "The army that learned to return must now learn to cross into Germany. Bring the infantry, assault engineers and bridging parties into the same rehearsal."
 TPMP_FRA_veteran_army:0 "Keep the Veteran Army Together"
 TPMP_FRA_veteran_army_desc:0 "Preserve the field army’s accumulated experience and give it the final training and replacement window for the last campaign."
 TPMP_FRA_army_modifier:0 "The French Army"
 TPMP_FRA_army_modifier_desc:0 "The army's chosen command and employment reforms. These gains preserve a national military identity; the 1940 campaign collapse remains a separate, explicit rule."
 TPMP_FRA_air_modifier:0 "The French Air Service"
 TPMP_FRA_air_modifier_desc:0 "Operational methods, trained ground crews and accumulated experience survive the loss of assembly lines."
 TPMP_FRA_fleet_modifier:0 "The French Naval Service"
 TPMP_FRA_fleet_modifier_desc:0 "A fleet's value lies in trained crews, operational methods and sustained service, not duplicated hulls."
 TPMP_FRA_economy_modifier:0 "The Republican Arsenal"
 TPMP_FRA_economy_modifier_desc:0 "Productive skills, series manufacture and repair capacity built before defeat remain part of France's industrial competence."
 TPMP_FRA_liberation_modifier:0 "The Army and State of Liberation"
 TPMP_FRA_liberation_modifier_desc:0 "The overseas army, its selected specialty, its support services and the authority of the returning Republic."
 TPMP_FRA_matignon_compact:0 "The Matignon Compact"
 TPMP_FRA_matignon_compact_desc:0 "A negotiated settlement underwrites the armaments effort."
 TPMP_FRA_concentration:0 "Continuity of Contracts"
 TPMP_FRA_concentration_desc:0 "A democratic conservative cabinet favors purchasing continuity and reserves political room for mobilization."
 TPMP_FRA_series_1:0 "Series Manufacture"
 TPMP_FRA_series_1_desc:0 "Common series reduce the cost of equipping the army."
 TPMP_FRA_series_2:0 "Series Manufacture"
 TPMP_FRA_series_2_desc:0 "Additional shifts and settled series expand economical deliveries."
 TPMP_FRA_series_3:0 "Series Manufacture"
 TPMP_FRA_series_3_desc:0 "Common ammunition and mature series support the army through the campaign and the later rebuild."
 TPMP_FRA_reserve_contract:0 "National Reserve Contract"
 TPMP_FRA_reserve_contract_desc:0 "Two civilian factories are committed for 120 days to the active prepaid reserve contract."
 TPMP_FRA_trained_cadres:0 "The Cadres Return"
 TPMP_FRA_trained_cadres_desc:0 "The called-up reserve brings trained instructors and junior leaders. This temporary advantage lasts 120 days."
 TPMP_FRA_campaign_warning:0 "The Campaign of 1940"
 TPMP_FRA_campaign_warning_desc:0 "France is intended to fight fiercely, then fall. While at war with Germany, strategic collapse begins on 1 June 1940, deepens on 1 August, and ends metropolitan resistance on 1 October. On that deadline, French-owned European core states pass to German control and the surrender threshold is forced down. Prewar preparation determines what France can do before defeat and what it rebuilds afterward."
 TPMP_FRA_collapse_june:0 "The Strategic Front Unravels"
 TPMP_FRA_collapse_june_desc:0 "From 1 June 1940, institutional and logistical exhaustion unravel the metropolitan defense. The end of the campaign is approaching."
 TPMP_FRA_collapse_august:0 "The Metropolitan Army Breaks"
 TPMP_FRA_collapse_august_desc:0 "From 1 August 1940 the remaining metropolitan defense can no longer sustain a coherent campaign. France must prepare to continue overseas."
 TPMP_FRA_collapse_terminal:0 "The Metropolitan Campaign Is Over"
 TPMP_FRA_collapse_terminal_desc:0 "The 1 October deadline ends metropolitan resistance through the surrender system. European French core territory is placed under German control; the war continues from overseas."
 TPMP_FRA_forty_hours_industry_ns:0 "The Matignon Work Settlement"
 TPMP_FRA_forty_hours_industry_ns_desc:0 "Buy social confidence with a peacetime production concession. Later emergency legislation can recover the lost output."
 TPMP_FRA_collective_contracts_industry_ns:0 "The Negotiated Armaments Programme"
 TPMP_FRA_collective_contracts_industry_ns_desc:0 "Carry the agreement from the negotiating table to the shop floor. Stable shifts and common series will give the workers and the purchasing service a programme they can both keep."
 TPMP_FRA_industrial_partners_industry_ns:0 "Guaranteed Industrial Contracts"
 TPMP_FRA_industrial_partners_industry_ns_desc:0 "Exchange public purchasing guarantees for private investment. Productive capacity grows, but civilian obligations absorb part of the gain."
 TPMP_FRA_organize_professions_industry_ns:0 "The Professional Settlement"
 TPMP_FRA_organize_professions_industry_ns_desc:0 "Standardize apprenticeship and workshop qualifications across the conservative coalition. The useful payoff is faster entry into a production series."
 TPMP_FRA_triple_defence_industry_ns:0 "Extraordinary Defense Appropriations"
 TPMP_FRA_triple_defence_industry_ns_desc:0 "Front-load the armaments effort for the opening war. Consumer production and public confidence pay for a large but temporary drive."
 TPMP_FRA_civilian_settlement_industry_ns:0 "A Sustainable War Economy"
 TPMP_FRA_civilian_settlement_industry_ns_desc:0 "Retain more civil capacity and improve the efficiency ceiling. The result matures less spectacularly than emergency military output."
 TPMP_FRA_industrial_credit_industry_ns:0 "Subcontractor Credit"
 TPMP_FRA_industrial_credit_industry_ns_desc:0 "Finance small firms which can actually deliver during the next production window. The fund cannot be renewed until the first credit has run its course."
 TPMP_FRA_market_fund_industry_ns:0 "National Equipment Credit"
 TPMP_FRA_market_fund_industry_ns_desc:0 "Renew a completed credit cycle and add durable civilian capacity. Waiting for the first loan period is a visible part of the choice."
 TPMP_FRA_tulle_cartridges_industry_ns:0 "Standard Small-Arms Contracts"
 TPMP_FRA_tulle_cartridges_industry_ns_desc:0 "The cartridge is less celebrated than the rifle and consumed far more quickly. Settle the small-arms contracts around ammunition, spare parts and interchangeable fittings."
 TPMP_FRA_schneider_orders_industry_ns:0 "The Schneider Series"
 TPMP_FRA_schneider_orders_industry_ns_desc:0 "The gun, its sights, ammunition and towing arrangements belong to one programme. The artillery bureau will test a complete battery before placing the next series."
 TPMP_FRA_automobile_contracts_industry_ns:0 "The Automobile Orders"
 TPMP_FRA_automobile_contracts_industry_ns_desc:0 "France has motor manufacturers. The army needs a transport service: common loads, repair instructions and vehicles its mechanics can keep on the road."
 TPMP_FRA_tank_series_industry_ns:0 "Common Armor Series"
 TPMP_FRA_tank_series_industry_ns_desc:0 "Commit tooling to an economical armor series. The alternative puts more resources into protected breakthrough vehicles."
 TPMP_FRA_protected_castings_industry_ns:0 "Protected Armor Castings"
 TPMP_FRA_protected_castings_industry_ns_desc:0 "Pay more per hull to improve armor construction. The benefits favor deliberate breakthrough formations rather than a cheap vehicle race."
 TPMP_FRA_long_series_industry_ns:0 "The Final Rearmament Shift"
 TPMP_FRA_long_series_industry_ns_desc:0 "A stable series can give the last prewar production window real weight. The output drive ends after 180 days; established cost reductions remain."
 TPMP_FRA_richelieu_trials_industry_ns:0 "Priority Fitting-Out"
 TPMP_FRA_richelieu_trials_industry_ns_desc:0 "The hull is an undertaking of national scale; the trials turn it into a fighting ship. Concentrate the fitting-out crews and resolve the faults that still stand between the fleet and its investment."
 TPMP_FRA_escort_hulls_industry_ns:0 "The Escort Construction Series"
 TPMP_FRA_escort_hulls_industry_ns_desc:0 "Trade a year of inexpensive escort production against heavier construction priorities."
 TPMP_FRA_refit_programme_industry_ns:0 "The Fleet Refit Programme"
 TPMP_FRA_refit_programme_industry_ns_desc:0 "Commit civilian repair capacity for six months to a focused refit programme. The civilian cost is real and ends with the temporary spirit."
 TPMP_FRA_workshop_crews_industry_ns:0 "The Overseas Workshop Service"
 TPMP_FRA_workshop_crews_industry_ns_desc:0 "Use scarce technical personnel to sustain the equipment actually in service, with a modest repair and conversion specialty."
 TPMP_FRA_training_camps_industry_ns:0 "The Army of Liberation Training Establishment"
 TPMP_FRA_training_camps_industry_ns_desc:0 "The recruits arrive with different drill, equipment and memories of the defeat. The instructors have to make them ready to march under one command."
 TPMP_FRA_division_strasbourg_industry_ns:0 "The Division’s Transport Establishment"
 TPMP_FRA_division_strasbourg_industry_ns_desc:0 "The promise now has a divisional staff and a working transport service. Rehearse the advance as a formation that can keep moving after its first success."
 TPMP_FRA_civil_liaison_industry_ns:0 "Civil Reconstruction Teams"
 TPMP_FRA_civil_liaison_industry_ns_desc:0 "Prepare the administrators and technical services who can make liberated districts useful to the army."
 TPMP_FRA_restore_workshops_industry_ns:0 "The National Reconstruction Drive"
 TPMP_FRA_restore_workshops_industry_ns_desc:0 "The machines are damaged, the power uncertain and the workers scattered. Bring the repair teams and the surviving foremen together around the first production orders of the liberated Republic."
 TPMP_FRA_skilled_trades_industry_ns:0 "The Arsenal Tooling Programme"
 TPMP_FRA_skilled_trades_industry_ns_desc:0 "The bottleneck is often the person at the machine. Expand apprenticeships and inspection skills before adding another paper order."
 TPMP_FRA_machine_tools_industry_ns:0 "The Arsenal Tooling Programme"
 TPMP_FRA_machine_tools_industry_ns_desc:0 "Tool the subcontractors as well as the principal works. Common gauges and spare capacity make changing production less destructive."
 TPMP_FRA_dispersed_workshops_industry_ns:0 "The Dispersed Workshop Service"
 TPMP_FRA_dispersed_workshops_industry_ns_desc:0 "Prepare smaller repair and finishing shops away from the largest industrial concentrations. Their value is the ability to keep working under pressure."
 TPMP_FRA_overseas_workshop_plans_industry_ns:0 "The Dispersed Workshop Service"
 TPMP_FRA_overseas_workshop_plans_industry_ns_desc:0 "Send technical drawings, gauges and instructors to the overseas services. This prepares practical continuity without moving occupied factories by magic."
 TPMP_FRA_dautry_industry_ns:0 "Dautry at the Armaments Ministry"
 TPMP_FRA_dautry_industry_ns_desc:0 "A contract is useful when the arsenal can fulfill it. Put workshops, subcontractors and inspection schedules under one practical direction."
 TPMP_FRA_republican_arsenal_industry_ns:0 "The Republican Arsenal"
 TPMP_FRA_republican_arsenal_industry_ns_desc:0 "The factories belong to a country worth defending. Turn the settlement into regular shifts, trained hands and reliable deliveries."
 TPMP_FRA_contracts_without_interruption_industry_ns:0 "Contracts Without Interruption"
 TPMP_FRA_contracts_without_interruption_industry_ns_desc:0 "Ministers may change; delivery schedules must not. Give the purchasing services authority to carry contracts across cabinet reshuffles."
 TPMP_FRA_republic_resumes_industry_ns:0 "The Republic Resumes Its Work"
 TPMP_FRA_republic_resumes_industry_ns_desc:0 "The ministries return to buildings with broken windows and missing files. Reopen the services, repair the workshops and make the arrival of the government useful to the people who endured the occupation."
 TPMP_FRA_common_gauges_industry_ns:0 "The Arsenal Tooling Programme"
 TPMP_FRA_common_gauges_industry_ns_desc:0 "Make interchangeable parts more than a specification on paper. A mature inspection service improves output without discarding established tooling."
 TPMP_FRA_road_rail_industry_ns:0 "Roads to the Mobilization Depots"
 TPMP_FRA_road_rail_industry_ns_desc:0 "A division cannot assemble at the station after its train has left. Reconcile the civilian railway timetable with the depots, reservist districts and army supply plan."
 TPMP_FRA_air_fragmentation_1:0 "Fragmented Aircraft Production"
 TPMP_FRA_air_fragmentation_1_desc:0 "The aircraft engine and acceptance programme must be repaired before France can make full use of its aviation factories."
 TPMP_FRA_air_fragmentation_2:0 "Reorganizing Aircraft Production"
 TPMP_FRA_air_fragmentation_2_desc:0 "Common engine contracts have removed part of the aircraft surcharge; the Arsenal programme completes the transition."
 TPMP_FRA_staff_reform_1:0 "The War Council Reorganizes"
 TPMP_FRA_staff_reform_1_desc:0 "For the first 60 days the command transition costs cohesion. A second stage then eases the disruption."
 TPMP_FRA_staff_reform_2:0 "The Staff Learns the New Tempo"
 TPMP_FRA_staff_reform_2_desc:0 "The final 60 days of the transition carry a smaller cohesion cost."
 TPMP_FRA_supplied_maquis_ns:0 "The Maquis Receive Their Stores"
 TPMP_FRA_supplied_maquis_ns_desc:0 "A finite six-month effort sustained by actual equipment committed to the interior."
 TPMP_FRA_plan_vert_ns:0 "Plan Vert"
 TPMP_FRA_plan_vert_ns_desc:0 "A short prepared resistance offensive against occupation communications."
 TPMP_FRA_port_stores_identity_ns:0 "The Overseas Port Service"
 TPMP_FRA_port_stores_identity_ns_desc:0 "The workshops across the Mediterranean will be useless without a port service. Prepare fuel accounting, unloading parties and depots while the crossings are still routine."
 TPMP_FRA_class_b_identity_ns:0 "The Territorial Mobilization"
 TPMP_FRA_class_b_identity_ns_desc:0 "The reserve regiments have names and depots. Recall the officers who know them, refresh their instructions and give the mobilization a human framework."
 TPMP_FRA_march_battalions_identity_ns:0 "The March Battalion Schools"
 TPMP_FRA_march_battalions_identity_ns_desc:0 "Men from distant garrisons and volunteer groups must learn to serve in the same formation. Put experienced officers and instructors into the depots before sending new battalions out."
 TPMP_FRA_foreign_stores_identity_ns:0 "Make the Foreign Patterns Work"
 TPMP_FRA_foreign_stores_identity_ns_desc:0 "The weapons in the Allied depot were built to somebody else’s drawings. Choose a short conversion and repair effort so the workshops can support mixed equipment immediately."
 TPMP_FRA_workshop_surge_identity_ns:0 "Retool the Brazzaville Benches"
 TPMP_FRA_workshop_surge_identity_ns_desc:0 "Stop changing the work at every new requisition. Commit the small factories to a common pattern, accepting a short disruption in return for a dependable local series."
 TPMP_FRA_ports_receive_identity_ns:0 "The Port Clearance Parties"
 TPMP_FRA_ports_receive_identity_ns_desc:0 "Clear the quays, restore the workshops and put the unloading parties to work. The returning army needs a port that can receive tomorrow’s formation as well as today’s."
 TPMP_FRA_reserve_category:0 "The National Reserve"
 TPMP_FRA_reserve_category_desc:0 "Prepaid contracts preserve a practical reserve for the war.\nContracts placed: §Y[?TPMP_FRA_reserve_placed|0]/3§!. Only one may be active, using §Y2 civilian factories for 120 days§!.\nMature cadres: §Y[?TPMP_FRA_reserve_cadres|0]§! · Armaments: §Y[?TPMP_FRA_reserve_armaments|0]§! · Transport: §Y[?TPMP_FRA_reserve_transport|0]§!.\nCall mature reserves during the war. Actual capitulation releases them automatically; unfinished contracts still mature overseas. The three-contract lifetime limit never resets."
 TPMP_FRA_reserve_unlocked_tt:0 "Unlocks §YThe National Reserve§!: up to §Ythree§! prepaid 120-day contracts, one active at a time. Mature reserves can be called in wartime and release automatically after actual capitulation."
 TPMP_FRA_contract_cadres:0 "Train a Reserve Cadre"
 TPMP_FRA_contract_cadres_desc:0 "Commit 8,000 manpower, 45 political power and two civilian factories for 120 days. Mature cadres return 8,000 manpower, 20 army XP and a 120-day training advantage when called up. At most three reserve contracts can be placed in total; only one can be active."
 TPMP_FRA_contract_cadres_tt:0 "This contract matures after §Y120 days§!. 8,000 deposited manpower returned; +20 army XP; -10% training time and +15% division experience gain for 120 days (duration refreshes, strength does not stack)."
 TPMP_FRA_contract_armaments:0 "Place an Armaments Reserve Contract"
 TPMP_FRA_contract_armaments_desc:0 "Commit 45 political power and two civilian factories for 120 days. A mature contract provides 2,000 line infantry equipment, 250 support equipment and 150 artillery when called up. At most three reserve contracts can be placed in total; only one can be active."
 TPMP_FRA_contract_armaments_tt:0 "This contract matures after §Y120 days§!. 2,000 line infantry equipment; 250 support equipment; 150 artillery."
 TPMP_FRA_contract_transport:0 "Place a Motor Transport Reserve Contract"
 TPMP_FRA_contract_transport_desc:0 "Commit 45 political power and two civilian factories for 120 days. A mature contract provides 650 trucks, 30 trains and 50 convoys when called up. At most three reserve contracts can be placed in total; only one can be active."
 TPMP_FRA_contract_transport_tt:0 "This contract matures after §Y120 days§!. 650 trucks; 30 trains; 50 convoys."
 TPMP_FRA_call_reserve:0 "Call Up the Mature Reserve"
 TPMP_FRA_call_reserve_desc:0 "Release all mature contracts once. The lifetime allowance remains three contracts, and an unfinished contract continues to mature on its original date."
 tpmp_france.2.t:0 "France Will Continue"
 tpmp_france.2.d:0 "The metropolitan campaign has ended. The overseas chapter of the same focus tree is now unlocked. Any mature National Reserve contracts have been released; unfinished contracts will still arrive on schedule. We must pick up the pieces and build a specialist force for the return."
 tpmp_france.2.a:0 "The war is not over."
 tpmp_france.3.t:0 "The Strategic Front Unravels"
 tpmp_france.3.d:0 "June 1940. The accumulated strain on command, transport and formations begins to break the metropolitan army's cohesion. France can still make the campaign costly, but the campaign rule will deepen the collapse in August and end metropolitan resistance on 1 October."
 tpmp_france.3.a:0 "Keep the route overseas open."
 tpmp_france.4.t:0 "The Metropolitan Army Breaks"
 tpmp_france.4.d:0 "August 1940. The army can no longer sustain a coherent metropolitan defense. On 1 October, remaining French-owned European core states will pass to German control and the surrender threshold will be forced down. Preserve what can continue and prepare the overseas specialist army."
 tpmp_france.4.a:0 "France must survive its defeat."
 tpmp_france.5.t:0 "The End of the Metropolitan Campaign"
 tpmp_france.5.d:0 "1 October 1940 is the declared end of the French metropolitan campaign. Remaining French-owned European core states are placed under German control and the surrender threshold is forced down. The capitulation system now ends the defense; overseas possessions, surviving fleets and the Allied war continue. The overseas tree unlocks on actual capitulation."
 tpmp_france.5.a:0 "We will return."
 TPMP_FRA_staff_college_bonus:0 "The French Staff and Training Programme"
 TPMP_FRA_mountain_memory:0 "The Fire-Plan Inheritance"
 TPMP_FRA_mountain_memory_desc:0 "Methodical-battle instruction adapted to mountain formations: +5% mountain defense."
 TPMP_FRA_landing_memory:0 "The Interval-Troop Inheritance"
 TPMP_FRA_landing_memory_desc:0 "Field-engineering instruction adapted to the marine force: +5% river attack."
 TPMP_FRA_mobile_memory:0 "The DLM Inheritance"
 TPMP_FRA_mobile_memory_desc:0 "Mechanized cavalry instruction adapted to the mobile army: +5% motorized and mechanized breakthrough."
 TPMP_FRA_infantry_antitank:0 "Infantry Anti-Tank Schools"
 TPMP_FRA_infantry_antitank_desc:0 "Infantry and motorized infantry gain 8% hard attack and 12% piercing from coordinated anti-tank training."
 TPMP_FRA_mountain_columns_tech:0 "The Mountain Column Establishment"
 TPMP_FRA_mountain_columns_tech_desc:0 "Mountaineers gain an additional 10% mountain movement and 5% mountain attack."
 TPMP_FRA_assault_engineers_tech:0 "The Marine Assault Engineers"
 TPMP_FRA_assault_engineers_tech_desc:0 "Marines gain an additional 10% river attack from their inland assault training."
 TPMP_FRA_rhine_establishment:0 "The Rhine Crossing Establishment"
 TPMP_FRA_rhine_establishment_desc:0 "Infantry, motorized infantry, mountaineers and marines gain 5% river attack."
 TPMP_FRA_mountain_service:0 "The Expeditionary Mountain Service"
 TPMP_FRA_mountain_service_desc:0 "Mountain assault training and carriage arrangements for the specialist expeditionary corps."
 TPMP_FRA_landing_service:0 "The Landing Force's Inland Training"
 TPMP_FRA_landing_service_desc:0 "River-crossing and wet-ground training keeps the marine contingent useful beyond the beachhead."
